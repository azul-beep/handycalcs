<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Loan Calculator | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/auto-loan-calculator/"><link rel="stylesheet" href="/style.css?v=3">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="autoloan" novalidate><div class="f"><label for="autoloan-price">Vehicle price</label><div class="inp hp"><span class="pre">$</span><input id="autoloan-price" data-in="price" type="number" inputmode="decimal" step="100" min="0" value="32000"></div></div><div class="f"><label for="autoloan-down">Down payment</label><div class="inp hp"><span class="pre">$</span><input id="autoloan-down" data-in="down" type="number" inputmode="decimal" step="100" min="0" value="4000"></div></div><div class="f"><label for="autoloan-trade">Trade-in value</label><div class="inp hp"><span class="pre">$</span><input id="autoloan-trade" data-in="trade" type="number" inputmode="decimal" step="100" min="0" value="0"></div></div><div class="f"><label for="autoloan-tradetax">Does your state tax only the difference after trade-in?</label><div class="inp"><select id="autoloan-tradetax" data-in="tradetax"><option value="yes" selected>Yes</option><option value="no">No</option></select></div></div><div class="f"><label for="autoloan-tax">Sales tax</label><div class="inp hs"><input id="autoloan-tax" data-in="tax" type="number" inputmode="decimal" step="0.01" min="0" value="7"><span class="post">%</span></div></div><div class="f"><label for="autoloan-fees">Title, registration and dealer fees</label><div class="inp hp"><span class="pre">$</span><input id="autoloan-fees" data-in="fees" type="number" inputmode="decimal" step="10" min="0" value="800"></div></div><div class="f"><label for="autoloan-apr">Interest rate (APR)</label><div class="inp hs"><input id="autoloan-apr" data-in="apr" type="number" inputmode="decimal" step="0.01" min="0" value="7.5"><span class="post">%</span></div></div><div class="f"><label for="autoloan-months">Loan term</label><div class="inp"><select id="autoloan-months" data-in="months"><option value="36">36 months</option><option value="48">48 months</option><option value="60" selected>60 months</option><option value="72">72 months</option><option value="84">84 months</option></select></div></div>
<button class="btn wide" type="submit">Calculate</button></form>
<div class="results"><h2 class="sr">Results</h2><div class="out big"><span>Monthly payment</span><strong data-out="monthly" aria-live="polite">—</strong></div><div class="out"><span>Amount financed</span><strong data-out="loanAmt" aria-live="polite">—</strong></div><div class="out"><span>Sales tax</span><strong data-out="salesTax" aria-live="polite">—</strong></div><div class="out"><span>Total interest</span><strong data-out="interest" aria-live="polite">—</strong></div><div class="out"><span>Total cost of the car</span><strong data-out="total" aria-live="polite">—</strong></div><p class="small priv">🔒 Private: everything is calculated on your device.</p></div></section>

</main><script src="/calc.js?v=3" defer></script></body></html>
