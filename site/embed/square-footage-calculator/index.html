<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Square Footage Calculator | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/square-footage-calculator/"><link rel="stylesheet" href="/style.css?v=3">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="sqft" novalidate><div class="f"><label for="sqft-length">Length</label><div class="inp"><input id="sqft-length" data-in="length" type="number" inputmode="decimal" step="0.1" min="0" value="12"></div></div><div class="f"><label for="sqft-width">Width</label><div class="inp"><input id="sqft-width" data-in="width" type="number" inputmode="decimal" step="0.1" min="0" value="10"></div></div><div class="f"><label for="sqft-unit">Unit</label><div class="inp"><select id="sqft-unit" data-in="unit"><option value="ft" selected>Feet</option><option value="in">Inches</option><option value="yd">Yards</option><option value="m">Meters</option></select></div></div><div class="f"><label for="sqft-count">Number of equal rooms or areas</label><div class="inp"><input id="sqft-count" data-in="count" type="number" inputmode="decimal" step="1" min="1" value="1"></div></div><div class="f"><label for="sqft-waste">Extra for cuts and waste</label><div class="inp hs"><input id="sqft-waste" data-in="waste" type="number" inputmode="decimal" step="1" min="0" value="10"><span class="post">%</span></div></div><div class="f"><label for="sqft-cost">Price per square foot (optional)</label><div class="inp hp"><span class="pre">$</span><input id="sqft-cost" data-in="cost" type="number" inputmode="decimal" step="0.01" min="0" value="0"></div></div>
<button class="btn wide" type="submit">Calculate</button></form>
<div class="results"><h2 class="sr">Results</h2><div class="out big"><span>Area</span><strong data-out="area" aria-live="polite">—</strong></div><div class="out"><span>In square meters and yards</span><strong data-out="metric" aria-live="polite">—</strong></div><div class="out"><span>Material to buy (with extra)</span><strong data-out="buy" aria-live="polite">—</strong></div><div class="out"><span>Material cost</span><strong data-out="cost" aria-live="polite">—</strong></div><p class="small priv">🔒 Private: everything is calculated on your device.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/square-footage-calculator/" target="_blank" rel="noopener">Square Footage Calculator</a> · Free calculators at <a href="https://gethandycalcs.pages.dev/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=3" defer></script></body></html>
