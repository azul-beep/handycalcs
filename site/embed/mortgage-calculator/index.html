<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mortgage Calculator | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/mortgage-calculator/"><link rel="stylesheet" href="/style.css?v=3">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="mortgage" novalidate><div class="f"><label for="mortgage-price">Home price</label><div class="inp hp"><span class="pre">$</span><input id="mortgage-price" data-in="price" type="number" inputmode="decimal" step="1000" min="0" value="400000"></div></div><div class="f"><label for="mortgage-down">Down payment</label><div class="inp hs"><input id="mortgage-down" data-in="down" type="number" inputmode="decimal" step="1" min="0" value="20"><span class="post">%</span></div></div><div class="chips" role="group"><button type="button" class="chip" data-set="mortgage-down" data-val="3.5">3.5%</button><button type="button" class="chip" data-set="mortgage-down" data-val="5">5%</button><button type="button" class="chip" data-set="mortgage-down" data-val="10">10%</button><button type="button" class="chip" data-set="mortgage-down" data-val="20">20%</button></div><div class="f"><label for="mortgage-rate">Interest rate</label><div class="inp hs"><input id="mortgage-rate" data-in="rate" type="number" inputmode="decimal" step="0.01" min="0" value="6.5"><span class="post">%</span></div></div><div class="f"><label for="mortgage-years">Loan term</label><div class="inp"><select id="mortgage-years" data-in="years"><option value="30" selected>30 years</option><option value="20">20 years</option><option value="15">15 years</option><option value="10">10 years</option></select></div></div><div class="f"><label for="mortgage-taxrate">Property tax per year</label><div class="inp hs"><input id="mortgage-taxrate" data-in="taxrate" type="number" inputmode="decimal" step="0.01" min="0" value="1.1"><span class="post">%</span></div></div><div class="f"><label for="mortgage-insurance">Home insurance per year</label><div class="inp hp"><span class="pre">$</span><input id="mortgage-insurance" data-in="insurance" type="number" inputmode="decimal" step="10" min="0" value="1800"></div></div><div class="f"><label for="mortgage-pmi">PMI if down payment is under 20%</label><div class="inp hs"><input id="mortgage-pmi" data-in="pmi" type="number" inputmode="decimal" step="0.05" min="0" value="0.7"><span class="post">%</span></div></div><div class="f"><label for="mortgage-hoa">HOA fees per month</label><div class="inp hp"><span class="pre">$</span><input id="mortgage-hoa" data-in="hoa" type="number" inputmode="decimal" step="5" min="0" value="0"></div></div>
<button class="btn wide" type="submit">Calculate</button></form>
<div class="results"><h2 class="sr">Results</h2><div class="out big"><span>Monthly payment</span><strong data-out="monthly" aria-live="polite">—</strong></div><div class="out"><span>Principal and interest</span><strong data-out="pi" aria-live="polite">—</strong></div><div class="out"><span>Property tax / insurance per month</span><strong data-out="taxes" aria-live="polite">—</strong></div><div class="out"><span>PMI per month</span><strong data-out="pmiOut" aria-live="polite">—</strong></div><div class="out"><span>Loan amount</span><strong data-out="loanAmt" aria-live="polite">—</strong></div><div class="out"><span>Total interest over the loan</span><strong data-out="interest" aria-live="polite">—</strong></div><p class="small priv">🔒 Private: everything is calculated on your device.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/mortgage-calculator/" target="_blank" rel="noopener">Mortgage Calculator</a> · Free calculators at <a href="https://gethandycalcs.pages.dev/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=3" defer></script></body></html>
