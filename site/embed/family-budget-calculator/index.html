<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Budget Calculator | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/family-budget-calculator/"><link rel="stylesheet" href="/style.css?v=5">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="budget" novalidate><div class="f"><label for="budget-income">Monthly take-home income</label><div class="inp hp"><span class="pre">$</span><input id="budget-income" data-in="income" type="number" inputmode="decimal" step="10" min="0" value="5200"></div></div><div class="f"><label for="budget-housing">Rent or mortgage</label><div class="inp hp"><span class="pre">$</span><input id="budget-housing" data-in="housing" type="number" inputmode="decimal" step="10" min="0" value="1600"></div></div><div class="f"><label for="budget-utilities">Utilities, phone, internet</label><div class="inp hp"><span class="pre">$</span><input id="budget-utilities" data-in="utilities" type="number" inputmode="decimal" step="10" min="0" value="320"></div></div><div class="f"><label for="budget-groceries">Groceries</label><div class="inp hp"><span class="pre">$</span><input id="budget-groceries" data-in="groceries" type="number" inputmode="decimal" step="10" min="0" value="750"></div></div><div class="f"><label for="budget-transport">Car, gas, transit</label><div class="inp hp"><span class="pre">$</span><input id="budget-transport" data-in="transport" type="number" inputmode="decimal" step="10" min="0" value="450"></div></div><div class="f"><label for="budget-insurance">Insurance and health</label><div class="inp hp"><span class="pre">$</span><input id="budget-insurance" data-in="insurance" type="number" inputmode="decimal" step="10" min="0" value="380"></div></div><div class="f"><label for="budget-debt">Debt payments</label><div class="inp hp"><span class="pre">$</span><input id="budget-debt" data-in="debt" type="number" inputmode="decimal" step="10" min="0" value="250"></div></div><div class="f"><label for="budget-childcare">Childcare and school</label><div class="inp hp"><span class="pre">$</span><input id="budget-childcare" data-in="childcare" type="number" inputmode="decimal" step="10" min="0" value="400"></div></div><div class="f"><label for="budget-other">Everything else</label><div class="inp hp"><span class="pre">$</span><input id="budget-other" data-in="other" type="number" inputmode="decimal" step="10" min="0" value="500"></div></div>
<button class="btn wide" type="submit">Calculate</button></form>
<div class="results"><h2 class="sr">Results</h2><div class="out big"><span>Left over each month</span><strong data-out="left" aria-live="polite">—</strong></div><div class="out"><span>Total expenses</span><strong data-out="spent" aria-live="polite">—</strong></div><div class="out"><span>Share of income spent</span><strong data-out="spentPct" aria-live="polite">—</strong></div><div class="out"><span>Housing share</span><strong data-out="housingPct" aria-live="polite">—</strong></div><p class="small priv">🔒 Private: everything is calculated on your device.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/family-budget-calculator/" target="_blank" rel="noopener">Family Budget Calculator</a> · Free calculators at <a href="https://gethandycalcs.pages.dev/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=5" defer></script></body></html>
