<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Card Calculator | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/time-card-calculator/"><link rel="stylesheet" href="/style.css?v=3">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="timecard" novalidate><div class="f"><div class="trow th" aria-hidden="true"><span>Start</span><span>End</span><span>Break (min)</span></div><span class="lab">Monday</span><div class="trow"><input id="timecard-d1" data-in="d1_s" type="time" value="09:00" aria-label="Monday Start"><input data-in="d1_e" type="time" value="17:30" aria-label="Monday End"><input data-in="d1_b" type="number" inputmode="numeric" min="0" step="5" value="30" aria-label="Monday Break (min)" placeholder="Break (min)"></div></div><div class="f"><span class="lab">Tuesday</span><div class="trow"><input id="timecard-d2" data-in="d2_s" type="time" value="09:00" aria-label="Tuesday Start"><input data-in="d2_e" type="time" value="17:30" aria-label="Tuesday End"><input data-in="d2_b" type="number" inputmode="numeric" min="0" step="5" value="30" aria-label="Tuesday Break (min)" placeholder="Break (min)"></div></div><div class="f"><span class="lab">Wednesday</span><div class="trow"><input id="timecard-d3" data-in="d3_s" type="time" value="09:00" aria-label="Wednesday Start"><input data-in="d3_e" type="time" value="17:30" aria-label="Wednesday End"><input data-in="d3_b" type="number" inputmode="numeric" min="0" step="5" value="30" aria-label="Wednesday Break (min)" placeholder="Break (min)"></div></div><div class="f"><span class="lab">Thursday</span><div class="trow"><input id="timecard-d4" data-in="d4_s" type="time" value="09:00" aria-label="Thursday Start"><input data-in="d4_e" type="time" value="17:30" aria-label="Thursday End"><input data-in="d4_b" type="number" inputmode="numeric" min="0" step="5" value="30" aria-label="Thursday Break (min)" placeholder="Break (min)"></div></div><div class="f"><span class="lab">Friday</span><div class="trow"><input id="timecard-d5" data-in="d5_s" type="time" value="09:00" aria-label="Friday Start"><input data-in="d5_e" type="time" value="17:30" aria-label="Friday End"><input data-in="d5_b" type="number" inputmode="numeric" min="0" step="5" value="30" aria-label="Friday Break (min)" placeholder="Break (min)"></div></div><div class="f"><span class="lab">Saturday</span><div class="trow"><input id="timecard-d6" data-in="d6_s" type="time" value="" aria-label="Saturday Start"><input data-in="d6_e" type="time" value="" aria-label="Saturday End"><input data-in="d6_b" type="number" inputmode="numeric" min="0" step="5" value="" aria-label="Saturday Break (min)" placeholder="Break (min)"></div></div><div class="f"><span class="lab">Sunday</span><div class="trow"><input id="timecard-d7" data-in="d7_s" type="time" value="" aria-label="Sunday Start"><input data-in="d7_e" type="time" value="" aria-label="Sunday End"><input data-in="d7_b" type="number" inputmode="numeric" min="0" step="5" value="" aria-label="Sunday Break (min)" placeholder="Break (min)"></div></div><div class="f"><label for="timecard-rate">Hourly wage (optional)</label><div class="inp hp"><span class="pre">$</span><input id="timecard-rate" data-in="rate" type="number" inputmode="decimal" step="0.01" min="0" value="18"></div></div>
<button class="btn wide" type="submit">Calculate</button></form>
<div class="results"><h2 class="sr">Results</h2><div class="out big"><span>Total hours this week</span><strong data-out="hours" aria-live="polite">—</strong></div><div class="out"><span>Overtime (over 40 h)</span><strong data-out="ot" aria-live="polite">—</strong></div><div class="out"><span>Gross pay (overtime at 1.5×)</span><strong data-out="pay" aria-live="polite">—</strong></div><div class="out"><span>Hours per day</span><pre data-out="days" aria-live="polite">—</pre></div><p class="small priv">🔒 Private: everything is calculated on your device.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/time-card-calculator/" target="_blank" rel="noopener">Time Card Calculator</a> · Free calculators at <a href="https://gethandycalcs.pages.dev/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=3" defer></script></body></html>
