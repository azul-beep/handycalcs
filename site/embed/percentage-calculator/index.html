<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Percentage Calculator | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/percentage-calculator/"><link rel="stylesheet" href="/style.css?v=5">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="percent" novalidate><div class="f"><label for="percent-mode">What do you want to know?</label><div class="inp"><select id="percent-mode" data-in="mode"><option value="of" selected>What is A% of B?</option><option value="is">A is what % of B?</option><option value="chg">% change from A to B</option></select></div></div><div class="f"><label for="percent-a">A</label><div class="inp"><input id="percent-a" data-in="a" type="number" inputmode="decimal" step="any" min="-1e12" value="15"></div></div><div class="f"><label for="percent-b">B</label><div class="inp"><input id="percent-b" data-in="b" type="number" inputmode="decimal" step="any" min="-1e12" value="80"></div></div>
<button class="btn wide" type="submit">Calculate</button></form>
<div class="results"><h2 class="sr">Results</h2><div class="out big"><span>Result</span><strong data-out="result" aria-live="polite">—</strong></div><p class="small priv">🔒 Private: everything is calculated on your device.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/percentage-calculator/" target="_blank" rel="noopener">Percentage Calculator</a> · Free calculators at <a href="https://gethandycalcs.pages.dev/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=5" defer></script></body></html>
