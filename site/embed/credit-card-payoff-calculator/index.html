<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credit Card Payoff Calculator | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/credit-card-payoff-calculator/"><link rel="stylesheet" href="/style.css?v=6">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="ccpayoff" novalidate><div class="f"><label for="ccpayoff-balance">Credit card balance</label><div class="inp hp"><span class="pre">$</span><input id="ccpayoff-balance" data-in="balance" type="number" inputmode="decimal" step="10" min="0" value="5000"></div></div><div class="f"><label for="ccpayoff-apr">Interest rate (APR)</label><div class="inp hs"><input id="ccpayoff-apr" data-in="apr" type="number" inputmode="decimal" step="0.1" min="0" value="22.9"><span class="post">%</span></div></div><div class="f"><label for="ccpayoff-payment">Monthly payment</label><div class="inp hp"><span class="pre">$</span><input id="ccpayoff-payment" data-in="payment" type="number" inputmode="decimal" step="5" min="0" value="200"></div></div><div class="f"><label for="ccpayoff-target">Months you want to be debt-free in</label><div class="inp"><input id="ccpayoff-target" data-in="target" type="number" inputmode="decimal" step="1" min="1" value="24"></div></div>
<button class="btn wide" type="submit">Calculate</button></form>
<div class="results"><h2 class="sr">Results</h2><div class="out big"><span>Time to pay it off</span><strong data-out="months" aria-live="polite">—</strong></div><div class="out"><span>Total interest you will pay</span><strong data-out="interest" aria-live="polite">—</strong></div><div class="out"><span>Payment to finish in your target months</span><strong data-out="needed" aria-live="polite">—</strong></div><p class="small priv">🔒 Private: everything is calculated on your device.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/credit-card-payoff-calculator/" target="_blank" rel="noopener">Credit Card Payoff Calculator</a> · Free calculators at <a href="https://gethandycalcs.pages.dev/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=6" defer></script></body></html>
