<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Tax Calculator | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/sales-tax-calculator/"><link rel="stylesheet" href="/style.css?v=2">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="salestax" novalidate><div class="f"><label for="salestax-mode">Mode</label><div class="inp"><select id="salestax-mode" data-in="mode"><option value="add" selected>Add tax to a price</option><option value="remove">Remove tax from a total</option></select></div></div><div class="f"><label for="salestax-amount">Amount</label><div class="inp hp"><span class="pre">$</span><input id="salestax-amount" data-in="amount" type="number" inputmode="decimal" step="0.01" min="0" value="100"></div></div><div class="f"><label for="salestax-rate">Sales tax rate</label><div class="inp hs"><input id="salestax-rate" data-in="rate" type="number" inputmode="decimal" step="0.01" min="0" value="7.25"><span class="post">%</span></div></div>
<button class="btn wide" type="submit">Calculate</button></form>
<div class="results"><h2 class="sr">Results</h2><div class="out big"><span>Total with tax</span><strong data-out="total" aria-live="polite">—</strong></div><div class="out"><span>Tax</span><strong data-out="tax" aria-live="polite">—</strong></div><div class="out"><span>Price before tax</span><strong data-out="pre" aria-live="polite">—</strong></div><p class="small priv">🔒 Private: everything is calculated on your device.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/sales-tax-calculator/" target="_blank" rel="noopener">Sales Tax Calculator</a> · Free calculators at <a href="https://gethandycalcs.pages.dev/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=2" defer></script></body></html>
