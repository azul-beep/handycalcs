<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Split the Bill Calculator | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/split-the-bill-calculator/"><link rel="stylesheet" href="/style.css?v=6">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="split" novalidate><div class="f"><label for="split-subtotal">Subtotal (before tax)</label><div class="inp hp"><span class="pre">$</span><input id="split-subtotal" data-in="subtotal" type="number" inputmode="decimal" step="0.01" min="0" value="120"></div></div><div class="f"><label for="split-tax">Sales tax on the bill</label><div class="inp hp"><span class="pre">$</span><input id="split-tax" data-in="tax" type="number" inputmode="decimal" step="0.01" min="0" value="8.4"></div></div><div class="f"><label for="split-tip">Tip percentage</label><div class="inp hs"><input id="split-tip" data-in="tip" type="number" inputmode="decimal" step="0.5" min="0" value="20"><span class="post">%</span></div></div><div class="f"><label for="split-pretax">Tip on the pre-tax amount?</label><div class="inp"><select id="split-pretax" data-in="pretax"><option value="yes" selected>Yes</option><option value="no">No</option></select></div></div><div class="f"><label for="split-people">Number of people</label><div class="inp"><input id="split-people" data-in="people" type="number" inputmode="decimal" step="1" min="1" value="4"></div></div>
<button class="btn wide" type="submit">Calculate</button></form>
<div class="results"><h2 class="sr">Results</h2><div class="out big"><span>Each person pays</span><strong data-out="each" aria-live="polite">—</strong></div><div class="out"><span>Total</span><strong data-out="total" aria-live="polite">—</strong></div><div class="out"><span>Tip</span><strong data-out="tipAmt" aria-live="polite">—</strong></div><div class="out"><span>Rounded up per person</span><strong data-out="rounded" aria-live="polite">—</strong></div><p class="small priv">🔒 Private: everything is calculated on your device.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/split-the-bill-calculator/" target="_blank" rel="noopener">Split the Bill Calculator</a> · Free calculators at <a href="https://gethandycalcs.pages.dev/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=6" defer></script></body></html>
