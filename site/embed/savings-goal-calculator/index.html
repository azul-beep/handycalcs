<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Savings Goal Calculator | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/savings-goal-calculator/"><link rel="stylesheet" href="/style.css?v=2">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="savings" novalidate><div class="f"><label for="savings-goal">Savings goal</label><div class="inp hp"><span class="pre">$</span><input id="savings-goal" data-in="goal" type="number" inputmode="decimal" step="10" min="0" value="10000"></div></div><div class="f"><label for="savings-current">Saved so far</label><div class="inp hp"><span class="pre">$</span><input id="savings-current" data-in="current" type="number" inputmode="decimal" step="10" min="0" value="1500"></div></div><div class="f"><label for="savings-monthly">Monthly deposit</label><div class="inp hp"><span class="pre">$</span><input id="savings-monthly" data-in="monthly" type="number" inputmode="decimal" step="10" min="0" value="400"></div></div><div class="f"><label for="savings-rate">Annual interest (savings account)</label><div class="inp hs"><input id="savings-rate" data-in="rate" type="number" inputmode="decimal" step="0.1" min="0" value="4"><span class="post">%</span></div></div>
<button class="btn wide" type="submit">Calculate</button></form>
<div class="results"><h2 class="sr">Results</h2><div class="out big"><span>Months to reach it</span><strong data-out="months" aria-live="polite">—</strong></div><div class="out"><span>Goal reached in</span><strong data-out="date" aria-live="polite">—</strong></div><div class="out"><span>Total you deposit</span><strong data-out="contrib" aria-live="polite">—</strong></div><p class="small priv">🔒 Private: everything is calculated on your device.</p></div></section>
