<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oven Temperature Converter | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/oven-temperature-converter/"><link rel="stylesheet" href="/style.css?v=5">

<body><main class="wrap"><section class="card calc"><form data-calc="oven" novalidate><div class="f"><label for="oven-temp">Temperature</label><div class="inp"><input id="oven-temp" data-in="temp" type="number" inputmode="decimal" step="1" min="-100" value="350"></div></div><div class="chips" role="group"><button type="button" class="chip" data-set="oven-temp" data-val="325">325</button><button type="button" class="chip" data-set="oven-temp" data-val="350">350</button><button type="button" class="chip" data-set="oven-temp" data-val="375">375</button><button type="button" class="chip" data-set="oven-temp" data-val="400">400</button><button type="button" class="chip" data-set="oven-temp" data-val="425">425</button></div><div class="f"><label for="oven-dir">Convert</label><div class="inp"><select id="oven-dir" data-in="dir"><option value="f2c" selected>°F → °C</option><option value="c2f">°C → °F</option></select></div></div>
<button class="btn wide" type="submit">Calculate</button></form>
<div class="results"><h2 class="sr">Results</h2><div class="out big"><span>Celsius</span><strong data-out="c" aria-live="polite">—</strong></div><div class="out"><span>Fahrenheit</span><strong data-out="f" aria-live="polite">—</strong></div><div class="out"><span>Fan / convection oven (°C)</span><strong data-out="fan" aria-live="polite">—</strong></div><div class="out"><span>Gas mark</span><strong data-out="gas" aria-live="polite">—</strong></div><p class="small priv">🔒 Private: everything is calculated on your device.</p></div></section>
