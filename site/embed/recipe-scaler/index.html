<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe Scaler | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/recipe-scaler/"><link rel="stylesheet" href="/style.css?v=4">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="scaler" novalidate><div class="f"><label for="scaler-from">Original servings</label><div class="inp"><input id="scaler-from" data-in="from" type="number" inputmode="decimal" step="1" min="1" value="4"></div></div><div class="f"><label for="scaler-to">Servings you want</label><div class="inp"><input id="scaler-to" data-in="to" type="number" inputmode="decimal" step="1" min="1" value="10"></div></div><div class="f"><label for="scaler-list">Ingredients (one per line, amount first)</label><textarea id="scaler-list" data-in="list" rows="6" spellcheck="false">2 cups flour
1 1/2 tsp baking powder
3/4 cup milk
2 eggs
1/2 cup sugar</textarea></div>
<button class="btn wide" type="submit">Calculate</button></form>
<div class="results"><h2 class="sr">Results</h2><div class="out big"><span>Multiply everything by</span><strong data-out="factor" aria-live="polite">—</strong></div><div class="out"><span>Scaled ingredients</span><pre data-out="list" aria-live="polite">—</pre><button type="button" class="chip" data-copy="list">Copy</button></div><p class="small priv">🔒 Private: everything is calculated on your device.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/recipe-scaler/" target="_blank" rel="noopener">Recipe Scaler</a> · Free calculators at <a href="https://gethandycalcs.pages.dev/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=4" defer></script></body></html>
