<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tip Pool Calculator (by hours) | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/tip-pool-calculator/"><link rel="stylesheet" href="/style.css?v=2">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="tipout" novalidate><div class="f"><label for="tipout-pool">Total tips to share</label><div class="inp hp"><span class="pre">$</span><input id="tipout-pool" data-in="pool" type="number" inputmode="decimal" step="0.01" min="0" value="850"></div></div><div class="f"><label for="tipout-share">Percent of tips that go to the pool</label><div class="inp hs"><input id="tipout-share" data-in="share" type="number" inputmode="decimal" step="1" min="0" value="100"><span class="post">%</span></div></div><div class="f"><label for="tipout-hours">Hours worked by each person (comma separated)</label><div class="inp"><input id="tipout-hours" data-in="hours" type="text" value="8, 6.5, 5, 4"></div></div>
<button class="btn wide" type="submit">Calculate</button></form>
<div class="results"><h2 class="sr">Results</h2><div class="out big"><span>Tips per hour</span><strong data-out="rate" aria-live="polite">—</strong></div><div class="out"><span>Amount shared</span><strong data-out="shared" aria-live="polite">—</strong></div><div class="out"><span>Amount not in the pool</span><strong data-out="kept" aria-live="polite">—</strong></div><div class="out"><span>Each person&#x27;s share</span><pre data-out="shares" aria-live="polite">—</pre></div><p class="small priv">🔒 Private: everything is calculated on your device.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/tip-pool-calculator/" target="_blank" rel="noopener">Tip Pool Calculator (by hours)</a> · Free calculators at <a href="https://gethandycalcs.pages.dev/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=2" defer></script></body></html>
