<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu Price Calculator | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/menu-price-calculator/"><link rel="stylesheet" href="/style.css?v=4">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="menuprice" novalidate><div class="f"><label for="menuprice-cost">Cost of the plate (ingredients)</label><div class="inp hp"><span class="pre">$</span><input id="menuprice-cost" data-in="cost" type="number" inputmode="decimal" step="0.01" min="0" value="4.2"></div></div><div class="f"><label for="menuprice-target">Target food cost percentage</label><div class="inp hs"><input id="menuprice-target" data-in="target" type="number" inputmode="decimal" step="0.5" min="0" value="30"><span class="post">%</span></div></div><div class="chips" role="group"><button type="button" class="chip" data-set="menuprice-target" data-val="25">25%</button><button type="button" class="chip" data-set="menuprice-target" data-val="28">28%</button><button type="button" class="chip" data-set="menuprice-target" data-val="30">30%</button><button type="button" class="chip" data-set="menuprice-target" data-val="32">32%</button><button type="button" class="chip" data-set="menuprice-target" data-val="35">35%</button></div>
<button class="btn wide" type="submit">Calculate</button></form>
<div class="results"><h2 class="sr">Results</h2><div class="out big"><span>Menu price</span><strong data-out="price" aria-live="polite">—</strong></div><div class="out"><span>Price ending in .99</span><strong data-out="rounded" aria-live="polite">—</strong></div><div class="out"><span>Gross profit per plate</span><strong data-out="profit" aria-live="polite">—</strong></div><div class="out"><span>Markup</span><strong data-out="markup" aria-live="polite">—</strong></div><p class="small priv">🔒 Private: everything is calculated on your device.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/menu-price-calculator/" target="_blank" rel="noopener">Menu Price Calculator</a> · Free calculators at <a href="https://gethandycalcs.pages.dev/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=4" defer></script></body></html>
