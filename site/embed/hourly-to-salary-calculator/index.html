<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<body><main class="wrap"><section class="card calc"><form data-calc="hourly" novalidate><div class="f"><label for="hourly-wage">Hourly wage</label><div class="inp hp"><span class="pre">$</span><input id="hourly-wage" data-in="wage" type="number" inputmode="decimal" step="0.01" min="0" value="18"></div></div><div class="f"><label for="hourly-hours">Hours per week</label><div class="inp"><input id="hourly-hours" data-in="hours" type="number" inputmode="decimal" step="0.5" min="0" value="40"></div></div><div class="f"><label for="hourly-weeks">Weeks worked per year</label><div class="inp"><input id="hourly-weeks" data-in="weeks" type="number" inputmode="decimal" step="1" min="0" value="52"></div></div>

<div class="results"><h2 class="sr">Results</h2><div class="out big"><span>Yearly salary</span><strong data-out="yearly" aria-live="polite">—</strong></div><div class="out"><span>Monthly</span><strong data-out="monthly" aria-live="polite">—</strong></div><div class="out"><span>Every two weeks</span><strong data-out="biweekly" aria-live="polite">—</strong></div><div class="out"><span>Weekly</span><strong data-out="weekly" aria-live="polite">—</strong></div><p class="small priv">🔒 Private: everything is calculated on your device.</p></div></section>
