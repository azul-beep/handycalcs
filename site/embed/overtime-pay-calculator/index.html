<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overtime Pay Calculator | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/overtime-pay-calculator/"><link rel="stylesheet" href="/style.css?v=4">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="overtime" novalidate><div class="f"><label for="overtime-rate">Regular hourly rate</label><div class="inp hp"><span class="pre">$</span><input id="overtime-rate" data-in="rate" type="number" inputmode="decimal" step="0.01" min="0" value="18"></div></div><div class="f"><label for="overtime-reg">Regular hours</label><div class="inp"><input id="overtime-reg" data-in="reg" type="number" inputmode="decimal" step="0.25" min="0" value="40"></div></div><div class="f"><label for="overtime-ot">Overtime hours</label><div class="inp"><input id="overtime-ot" data-in="ot" type="number" inputmode="decimal" step="0.25" min="0" value="6"></div></div><div class="f"><label for="overtime-mult">Overtime rate</label><div class="inp"><select id="overtime-mult" data-in="mult"><option value="1.5" selected>Time and a half (1.5×)</option><option value="2">Double time (2×)</option></select></div></div>
<button class="btn wide" type="submit">Calculate</button></form>
<div class="results"><h2 class="sr">Results</h2><div class="out big"><span>Total pay</span><strong data-out="total" aria-live="polite">—</strong></div><div class="out"><span>Overtime hourly rate</span><strong data-out="otRate" aria-live="polite">—</strong></div><div class="out"><span>Regular pay</span><strong data-out="regPay" aria-live="polite">—</strong></div><div class="out"><span>Overtime pay</span><strong data-out="otPay" aria-live="polite">—</strong></div><p class="small priv">🔒 Private: everything is calculated on your device.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/overtime-pay-calculator/" target="_blank" rel="noopener">Overtime Pay Calculator</a> · Free calculators at <a href="https://gethandycalcs.pages.dev/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=4" defer></script></body></html>
