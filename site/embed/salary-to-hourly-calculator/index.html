<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salary to Hourly Calculator | Handy Calcs</title><meta name="robots" content="noindex">

<body><main class="wrap"><section class="card calc"><form data-calc="salary" novalidate><div class="f"><label for="salary-salary">Yearly salary</label><div class="inp hp"><span class="pre">$</span><input id="salary-salary" data-in="salary" type="number" inputmode="decimal" step="100" min="0" value="50000"></div></div><div class="f"><label for="salary-hours">Hours per week</label><div class="inp"><input id="salary-hours" data-in="hours" type="number" inputmode="decimal" step="0.5" min="0" value="40"></div></div><div class="f"><label for="salary-weeks">Weeks worked per year</label><div class="inp"><input id="salary-weeks" data-in="weeks" type="number" inputmode="decimal" step="1" min="0" value="52"></div></div>

<div class="results"><h2 class="sr">Results</h2><div class="out big"><span>Hourly rate</span><strong data-out="hourly" aria-live="polite">—</strong></div><div class="out"><span>Per day (5-day week)</span><strong data-out="daily" aria-live="polite">—</strong></div><div class="out"><span>Weekly</span><strong data-out="weekly" aria-live="polite">—</strong></div><div class="out"><span>Monthly</span><strong data-out="monthly" aria-live="polite">—</strong></div><p class="small priv">🔒 Private: everything is calculated on your device.</p></div></section>
