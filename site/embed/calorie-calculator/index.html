<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calorie Calculator | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/calorie-calculator/"><link rel="stylesheet" href="/style.css?v=5">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="calorie" novalidate><div class="f"><label for="calorie-sex">Sex</label><div class="inp"><select id="calorie-sex" data-in="sex"><option value="f" selected>Female</option><option value="m">Male</option></select></div></div><div class="f"><label for="calorie-age">Age</label><div class="inp"><input id="calorie-age" data-in="age" type="number" inputmode="decimal" step="1" min="15" value="35"></div></div><div class="f"><label for="calorie-ft">Height (feet)</label><div class="inp"><input id="calorie-ft" data-in="ft" type="number" inputmode="decimal" step="1" min="0" value="5"></div></div><div class="f"><label for="calorie-inch">Height (inches)</label><div class="inp"><input id="calorie-inch" data-in="inch" type="number" inputmode="decimal" step="0.5" min="0" value="5"></div></div><div class="f"><label for="calorie-lb">Weight (pounds)</label><div class="inp"><input id="calorie-lb" data-in="lb" type="number" inputmode="decimal" step="0.5" min="0" value="150"></div></div><div class="f"><label for="calorie-activity">Activity level</label><div class="inp"><select id="calorie-activity" data-in="activity"><option value="1.2">Sedentary (little or no exercise)</option><option value="1.375" selected>Light (exercise 1–3 days a week)</option><option value="1.55">Moderate (exercise 3–5 days a week)</option><option value="1.725">Active (hard exercise 6–7 days a week)</option><option value="1.9">Very active (physical job plus training)</option></select></div></div>
<button class="btn wide" type="submit">Calculate</button></form>
<div class="results"><h2 class="sr">Results</h2><div class="out big"><span>Calories to maintain your weight</span><strong data-out="tdee" aria-live="polite">—</strong></div><div class="out"><span>Lose about 0.5 lb a week</span><strong data-out="lose05" aria-live="polite">—</strong></div><div class="out"><span>Lose about 1 lb a week</span><strong data-out="lose1" aria-live="polite">—</strong></div><div class="out"><span>Gain about 0.5 lb a week</span><strong data-out="gain" aria-live="polite">—</strong></div><div class="out"><span>Resting calories (BMR)</span><strong data-out="bmr" aria-live="polite">—</strong></div><p class="small priv">🔒 Private: everything is calculated on your device.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/calorie-calculator/" target="_blank" rel="noopener">Calorie Calculator</a> · Free calculators at <a href="https://gethandycalcs.pages.dev/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=5" defer></script></body></html>
