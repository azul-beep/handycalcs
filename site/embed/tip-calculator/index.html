<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tip Calculator | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/tip-calculator/"><link rel="stylesheet" href="/style.css?v=5">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="tip" novalidate><div class="f"><label for="tip-bill">Bill amount</label><div class="inp hp"><span class="pre">$</span><input id="tip-bill" data-in="bill" type="number" inputmode="decimal" step="0.01" min="0" value="60"></div></div><div class="f"><label for="tip-tip">Tip percentage</label><div class="inp hs"><input id="tip-tip" data-in="tip" type="number" inputmode="decimal" step="0.5" min="0" value="20"><span class="post">%</span></div></div><div class="chips" role="group"><button type="button" class="chip" data-set="tip-tip" data-val="15">15%</button><button type="button" class="chip" data-set="tip-tip" data-val="18">18%</button><button type="button" class="chip" data-set="tip-tip" data-val="20">20%</button><button type="button" class="chip" data-set="tip-tip" data-val="22">22%</button><button type="button" class="chip" data-set="tip-tip" data-val="25">25%</button></div><div class="f"><label for="tip-people">Number of people</label><div class="inp"><input id="tip-people" data-in="people" type="number" inputmode="decimal" step="1" min="1" value="1"></div></div>
<button class="btn wide" type="submit">Calculate</button></form>
<div class="results"><h2 class="sr">Results</h2><div class="out"><span>Tip</span><strong data-out="tipAmt" aria-live="polite">—</strong></div><div class="out big"><span>Total with tip</span><strong data-out="total" aria-live="polite">—</strong></div><div class="out"><span>Each person pays</span><strong data-out="perPerson" aria-live="polite">—</strong></div><div class="out"><span>Tip per person</span><strong data-out="tipPerPerson" aria-live="polite">—</strong></div><p class="small priv">🔒 Private: everything is calculated on your device.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/tip-calculator/" target="_blank" rel="noopener">Tip Calculator</a> · Free calculators at <a href="https://gethandycalcs.pages.dev/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=5" defer></script></body></html>
