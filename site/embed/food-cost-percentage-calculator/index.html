<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Food Cost Percentage Calculator | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/food-cost-percentage-calculator/"><link rel="stylesheet" href="/style.css?v=2">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="foodcost" novalidate><div class="f"><label for="foodcost-begin">Beginning inventory</label><div class="inp hp"><span class="pre">$</span><input id="foodcost-begin" data-in="begin" type="number" inputmode="decimal" step="0.01" min="0" value="8000"></div></div><div class="f"><label for="foodcost-purchases">Purchases during the period</label><div class="inp hp"><span class="pre">$</span><input id="foodcost-purchases" data-in="purchases" type="number" inputmode="decimal" step="0.01" min="0" value="12500"></div></div><div class="f"><label for="foodcost-end">Ending inventory</label><div class="inp hp"><span class="pre">$</span><input id="foodcost-end" data-in="end" type="number" inputmode="decimal" step="0.01" min="0" value="7200"></div></div><div class="f"><label for="foodcost-sales">Food sales in the period</label><div class="inp hp"><span class="pre">$</span><input id="foodcost-sales" data-in="sales" type="number" inputmode="decimal" step="0.01" min="0" value="43000"></div></div>
<button class="btn wide" type="submit">Calculate</button></form>
<div class="results"><h2 class="sr">Results</h2><div class="out big"><span>Food cost percentage</span><strong data-out="pctOut" aria-live="polite">—</strong></div><div class="out"><span>Cost of goods sold</span><strong data-out="cogs" aria-live="polite">—</strong></div><div class="out"><span>What it means</span><strong data-out="verdict" aria-live="polite">—</strong></div><p class="small priv">🔒 Private: everything is calculated on your device.</p></div></section>

</main><script src="/calc.js?v=2" defer></script></body></html>
