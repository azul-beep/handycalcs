<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compound Interest Calculator | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/compound-interest-calculator/"><link rel="stylesheet" href="/style.css?v=5">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="compound" novalidate><div class="f"><label for="compound-initial">Initial deposit</label><div class="inp hp"><span class="pre">$</span><input id="compound-initial" data-in="initial" type="number" inputmode="decimal" step="100" min="0" value="5000"></div></div><div class="f"><label for="compound-monthly">Monthly contribution</label><div class="inp hp"><span class="pre">$</span><input id="compound-monthly" data-in="monthly" type="number" inputmode="decimal" step="10" min="0" value="200"></div></div><div class="f"><label for="compound-rate">Annual interest rate</label><div class="inp hs"><input id="compound-rate" data-in="rate" type="number" inputmode="decimal" step="0.1" min="0" value="7"><span class="post">%</span></div></div><div class="f"><label for="compound-years">Years</label><div class="inp"><input id="compound-years" data-in="years" type="number" inputmode="decimal" step="1" min="0" value="20"></div></div><div class="f"><label for="compound-freq">Compounding</label><div class="inp"><select id="compound-freq" data-in="freq"><option value="12" selected>Monthly</option><option value="365">Daily</option><option value="4">Quarterly</option><option value="1">Yearly</option></select></div></div>
<button class="btn wide" type="submit">Calculate</button></form>
<div class="results"><h2 class="sr">Results</h2><div class="out big"><span>Future value</span><strong data-out="fv" aria-live="polite">—</strong></div><div class="out"><span>Total you put in</span><strong data-out="contrib" aria-live="polite">—</strong></div><div class="out"><span>Interest earned</span><strong data-out="earned" aria-live="polite">—</strong></div><div class="out"><span>Years to double (rule of 72)</span><strong data-out="doubling" aria-live="polite">—</strong></div><p class="small priv">🔒 Private: everything is calculated on your device.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/compound-interest-calculator/" target="_blank" rel="noopener">Compound Interest Calculator</a> · Free calculators at <a href="https://gethandycalcs.pages.dev/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=5" defer></script></body></html>
