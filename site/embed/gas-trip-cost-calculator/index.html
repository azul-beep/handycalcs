<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gas Trip Cost Calculator | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/gas-trip-cost-calculator/"><link rel="stylesheet" href="/style.css?v=4">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="gas" novalidate><div class="f"><label for="gas-distance">Distance (miles, one way)</label><div class="inp"><input id="gas-distance" data-in="distance" type="number" inputmode="decimal" step="1" min="0" value="240"></div></div><div class="f"><label for="gas-round">Round trip?</label><div class="inp"><select id="gas-round" data-in="round"><option value="yes" selected>Yes</option><option value="no">No</option></select></div></div><div class="f"><label for="gas-mpg">Fuel economy (MPG)</label><div class="inp"><input id="gas-mpg" data-in="mpg" type="number" inputmode="decimal" step="0.5" min="0" value="28"></div></div><div class="f"><label for="gas-price">Gas price per gallon</label><div class="inp hp"><span class="pre">$</span><input id="gas-price" data-in="price" type="number" inputmode="decimal" step="0.01" min="0" value="3.29"></div></div><div class="f"><label for="gas-people">People sharing the cost</label><div class="inp"><input id="gas-people" data-in="people" type="number" inputmode="decimal" step="1" min="1" value="1"></div></div>
<button class="btn wide" type="submit">Calculate</button></form>
<div class="results"><h2 class="sr">Results</h2><div class="out big"><span>Trip fuel cost</span><strong data-out="cost" aria-live="polite">—</strong></div><div class="out"><span>Cost per person</span><strong data-out="each" aria-live="polite">—</strong></div><div class="out"><span>Gas needed</span><strong data-out="gallons" aria-live="polite">—</strong></div><p class="small priv">🔒 Private: everything is calculated on your device.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/gas-trip-cost-calculator/" target="_blank" rel="noopener">Gas Trip Cost Calculator</a> · Free calculators at <a href="https://gethandycalcs.pages.dev/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=4" defer></script></body></html>
