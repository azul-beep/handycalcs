<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Final Grade Calculator | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/final-grade-calculator/"><link rel="stylesheet" href="/style.css?v=6">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="finalgrade" novalidate><div class="f"><label for="finalgrade-current">Current grade in the class</label><div class="inp hs"><input id="finalgrade-current" data-in="current" type="number" inputmode="decimal" step="0.1" min="0" value="85"><span class="post">%</span></div></div><div class="f"><label for="finalgrade-want">Grade you want at the end</label><div class="inp hs"><input id="finalgrade-want" data-in="want" type="number" inputmode="decimal" step="0.1" min="0" value="90"><span class="post">%</span></div></div><div class="chips" role="group"><button type="button" class="chip" data-set="finalgrade-want" data-val="70">70%</button><button type="button" class="chip" data-set="finalgrade-want" data-val="80">80%</button><button type="button" class="chip" data-set="finalgrade-want" data-val="90">90%</button></div><div class="f"><label for="finalgrade-weight">Weight of the final exam</label><div class="inp hs"><input id="finalgrade-weight" data-in="weight" type="number" inputmode="decimal" step="1" min="0" value="25"><span class="post">%</span></div></div>
<button class="btn wide" type="submit">Calculate</button></form>
<div class="results"><h2 class="sr">Results</h2><div class="out big"><span>You need on the final</span><strong data-out="need" aria-live="polite">—</strong></div><div class="out"><span>Is it possible?</span><strong data-out="note" aria-live="polite">—</strong></div><div class="out"><span>Final grade if you get 0</span><strong data-out="ifzero" aria-live="polite">—</strong></div><div class="out"><span>Final grade if you get 100</span><strong data-out="ifhundred" aria-live="polite">—</strong></div><p class="small priv">🔒 Private: everything is calculated on your device.</p></div></section>

</main><script src="/calc.js?v=6" defer></script></body></html>
