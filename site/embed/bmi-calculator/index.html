<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMI Calculator | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/bmi-calculator/"><link rel="stylesheet" href="/style.css?v=3">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="bmi" novalidate><div class="f"><label for="bmi-ft">Height (feet)</label><div class="inp"><input id="bmi-ft" data-in="ft" type="number" inputmode="decimal" step="1" min="0" value="5"></div></div><div class="f"><label for="bmi-inch">Height (inches)</label><div class="inp"><input id="bmi-inch" data-in="inch" type="number" inputmode="decimal" step="0.5" min="0" value="7"></div></div><div class="f"><label for="bmi-lb">Weight (pounds)</label><div class="inp"><input id="bmi-lb" data-in="lb" type="number" inputmode="decimal" step="0.5" min="0" value="160"></div></div>
<button class="btn wide" type="submit">Calculate</button></form>
<div class="results"><h2 class="sr">Results</h2><div class="out big"><span>Your BMI</span><strong data-out="bmi" aria-live="polite">—</strong></div><div class="out"><span>Category</span><strong data-out="cat" aria-live="polite">—</strong></div><div class="out"><span>Healthy weight for your height</span><strong data-out="range" aria-live="polite">—</strong></div><div class="out"><span>In metric</span><strong data-out="metric" aria-live="polite">—</strong></div><p class="small priv">🔒 Private: everything is calculated on your device.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/bmi-calculator/" target="_blank" rel="noopener">BMI Calculator</a> · Free calculators at <a href="https://gethandycalcs.pages.dev/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=3" defer></script></body></html>
