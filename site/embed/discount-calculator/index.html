<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discount Calculator | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/discount-calculator/"><link rel="stylesheet" href="/style.css?v=3">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="discount" novalidate><div class="f"><label for="discount-price">Original price</label><div class="inp hp"><span class="pre">$</span><input id="discount-price" data-in="price" type="number" inputmode="decimal" step="0.01" min="0" value="80"></div></div><div class="f"><label for="discount-off">Discount</label><div class="inp hs"><input id="discount-off" data-in="off" type="number" inputmode="decimal" step="1" min="0" value="25"><span class="post">%</span></div></div><div class="chips" role="group"><button type="button" class="chip" data-set="discount-off" data-val="10">10%</button><button type="button" class="chip" data-set="discount-off" data-val="20">20%</button><button type="button" class="chip" data-set="discount-off" data-val="25">25%</button><button type="button" class="chip" data-set="discount-off" data-val="30">30%</button><button type="button" class="chip" data-set="discount-off" data-val="50">50%</button></div><div class="f"><label for="discount-tax">Sales tax (optional)</label><div class="inp hs"><input id="discount-tax" data-in="tax" type="number" inputmode="decimal" step="0.01" min="0" value="0"><span class="post">%</span></div></div>
<button class="btn wide" type="submit">Calculate</button></form>
<div class="results"><h2 class="sr">Results</h2><div class="out big"><span>You pay</span><strong data-out="total" aria-live="polite">—</strong></div><div class="out"><span>You save</span><strong data-out="save" aria-live="polite">—</strong></div><div class="out"><span>Price after discount</span><strong data-out="after" aria-live="polite">—</strong></div><div class="out"><span>Sales tax</span><strong data-out="tax" aria-live="polite">—</strong></div><p class="small priv">🔒 Private: everything is calculated on your device.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/discount-calculator/" target="_blank" rel="noopener">Discount Calculator</a> · Free calculators at <a href="https://gethandycalcs.pages.dev/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=3" defer></script></body></html>
