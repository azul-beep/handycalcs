<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPA Calculator | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/gpa-calculator/"><link rel="stylesheet" href="/style.css?v=4">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="gpa" novalidate><div class="f"><label for="gpa-list">One class per line: grade and credits</label><textarea id="gpa-list" data-in="list" rows="6" spellcheck="false">English, A, 3
Algebra, B+, 4
Biology, A-, 4
History, B, 3
Art, A, 1</textarea></div><div class="f"><label for="gpa-prevgpa">Current cumulative GPA (optional)</label><div class="inp"><input id="gpa-prevgpa" data-in="prevgpa" type="number" inputmode="decimal" step="0.01" min="0" value="0"></div></div><div class="f"><label for="gpa-prevcr">Credits already completed (optional)</label><div class="inp"><input id="gpa-prevcr" data-in="prevcr" type="number" inputmode="decimal" step="1" min="0" value="0"></div></div>
<button class="btn wide" type="submit">Calculate</button></form>
<div class="results"><h2 class="sr">Results</h2><div class="out big"><span>GPA for these classes</span><strong data-out="gpa" aria-live="polite">—</strong></div><div class="out"><span>New cumulative GPA</span><strong data-out="cum" aria-live="polite">—</strong></div><div class="out"><span>Credits counted</span><strong data-out="credits" aria-live="polite">—</strong></div><p class="small priv">🔒 Private: everything is calculated on your device.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/gpa-calculator/" target="_blank" rel="noopener">GPA Calculator</a> · Free calculators at <a href="https://gethandycalcs.pages.dev/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=4" defer></script></body></html>
