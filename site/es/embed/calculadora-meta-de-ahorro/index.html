<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="canonical" href="https://gethandycalcs.pages.dev/es/calculadora-meta-de-ahorro/"><link rel="stylesheet" href="/style.css?v=6">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="savings" novalidate><div class="f"><label for="savings-goal">Meta de ahorro</label><div class="inp hp"><span class="pre">$</span><input id="savings-goal" data-in="goal" type="number" inputmode="decimal" step="10" min="0" value="10000"></div></div><div class="f"><label for="savings-current">Ahorrado hasta ahora</label><div class="inp hp"><span class="pre">$</span><input id="savings-current" data-in="current" type="number" inputmode="decimal" step="10" min="0" value="1500"></div></div><div class="f"><label for="savings-monthly">Depósito mensual</label><div class="inp hp"><span class="pre">$</span><input id="savings-monthly" data-in="monthly" type="number" inputmode="decimal" step="10" min="0" value="400"></div></div><div class="f"><label for="savings-rate">Interés anual (cuenta de ahorro)</label><div class="inp hs"><input id="savings-rate" data-in="rate" type="number" inputmode="decimal" step="0.1" min="0" value="4"><span class="post">%</span></div></div>
<button class="btn wide" type="submit">Calcular</button></form>
<div class="results"><h2 class="sr">Resultados</h2><div class="out big"><span>Meses para llegar</span><strong data-out="months" aria-live="polite">—</strong></div><div class="out"><span>Llegas en</span><strong data-out="date" aria-live="polite">—</strong></div><div class="out"><span>Total que depositas</span><strong data-out="contrib" aria-live="polite">—</strong></div><p class="small priv">🔒 Privado: todo se calcula en tu dispositivo.</p></div></section>

</main><script src="/calc.js?v=6" defer></script></body></html>
