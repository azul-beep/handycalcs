<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="split" novalidate><div class="f"><label for="split-subtotal">Subtotal (sin impuesto)</label><div class="inp hp"><span class="pre">$</span><input id="split-subtotal" data-in="subtotal" type="number" inputmode="decimal" step="0.01" min="0" value="120"></div></div><div class="f"><label for="split-tax">Impuesto de la cuenta</label><div class="inp hp"><span class="pre">$</span><input id="split-tax" data-in="tax" type="number" inputmode="decimal" step="0.01" min="0" value="8.4"></div></div><div class="f"><label for="split-tip">Porcentaje de propina</label><div class="inp hs"><input id="split-tip" data-in="tip" type="number" inputmode="decimal" step="0.5" min="0" value="20"><span class="post">%</span></div></div><div class="f"><label for="split-pretax">¿Propina sobre el monto sin impuesto?</label><div class="inp"><select id="split-pretax" data-in="pretax"><option value="yes" selected>Sí</option><option value="no">No</option></select></div></div><div class="f"><label for="split-people">Cantidad de personas</label><div class="inp"><input id="split-people" data-in="people" type="number" inputmode="decimal" step="1" min="1" value="4"></div></div>
<button class="btn wide" type="submit">Calcular</button></form>
<div class="results"><h2 class="sr">Resultados</h2><div class="out big"><span>Paga cada uno</span><strong data-out="each" aria-live="polite">—</strong></div><div class="out"><span>Total</span><strong data-out="total" aria-live="polite">—</strong></div><div class="out"><span>Propina</span><strong data-out="tipAmt" aria-live="polite">—</strong></div><div class="out"><span>Redondeado por persona</span><strong data-out="rounded" aria-live="polite">—</strong></div><p class="small priv">🔒 Privado: todo se calcula en tu dispositivo.</p></div></section>
