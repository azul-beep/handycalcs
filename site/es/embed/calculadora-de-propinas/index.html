<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de propinas | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/es/calculadora-de-propinas/"><link rel="stylesheet" href="/style.css?v=3">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="tip" novalidate><div class="f"><label for="tip-bill">Total de la cuenta</label><div class="inp hp"><span class="pre">$</span><input id="tip-bill" data-in="bill" type="number" inputmode="decimal" step="0.01" min="0" value="60"></div></div><div class="f"><label for="tip-tip">Porcentaje de propina</label><div class="inp hs"><input id="tip-tip" data-in="tip" type="number" inputmode="decimal" step="0.5" min="0" value="20"><span class="post">%</span></div></div><div class="chips" role="group"><button type="button" class="chip" data-set="tip-tip" data-val="15">15%</button><button type="button" class="chip" data-set="tip-tip" data-val="18">18%</button><button type="button" class="chip" data-set="tip-tip" data-val="20">20%</button><button type="button" class="chip" data-set="tip-tip" data-val="22">22%</button><button type="button" class="chip" data-set="tip-tip" data-val="25">25%</button></div><div class="f"><label for="tip-people">Cantidad de personas</label><div class="inp"><input id="tip-people" data-in="people" type="number" inputmode="decimal" step="1" min="1" value="1"></div></div>
<button class="btn wide" type="submit">Calcular</button></form>
<div class="results"><h2 class="sr">Resultados</h2><div class="out"><span>Propina</span><strong data-out="tipAmt" aria-live="polite">—</strong></div><div class="out big"><span>Total con propina</span><strong data-out="total" aria-live="polite">—</strong></div><div class="out"><span>Paga cada uno</span><strong data-out="perPerson" aria-live="polite">—</strong></div><div class="out"><span>Propina por persona</span><strong data-out="tipPerPerson" aria-live="polite">—</strong></div><p class="small priv">🔒 Privado: todo se calcula en tu dispositivo.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/es/calculadora-de-propinas/" target="_blank" rel="noopener">Calculadora de propinas</a> · Calculadoras gratis en <a href="https://gethandycalcs.pages.dev/es/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=3" defer></script></body></html>
