<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora para pagar la tarjeta | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/es/calculadora-pagar-tarjeta-de-credito/"><link rel="stylesheet" href="/style.css?v=5">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="ccpayoff" novalidate><div class="f"><label for="ccpayoff-balance">Saldo de la tarjeta</label><div class="inp hp"><span class="pre">$</span><input id="ccpayoff-balance" data-in="balance" type="number" inputmode="decimal" step="10" min="0" value="5000"></div></div><div class="f"><label for="ccpayoff-apr">Tasa de interés (APR)</label><div class="inp hs"><input id="ccpayoff-apr" data-in="apr" type="number" inputmode="decimal" step="0.1" min="0" value="22.9"><span class="post">%</span></div></div><div class="f"><label for="ccpayoff-payment">Pago mensual</label><div class="inp hp"><span class="pre">$</span><input id="ccpayoff-payment" data-in="payment" type="number" inputmode="decimal" step="5" min="0" value="200"></div></div><div class="f"><label for="ccpayoff-target">En cuántos meses quieres terminar</label><div class="inp"><input id="ccpayoff-target" data-in="target" type="number" inputmode="decimal" step="1" min="1" value="24"></div></div>
<button class="btn wide" type="submit">Calcular</button></form>
<div class="results"><h2 class="sr">Resultados</h2><div class="out big"><span>Tiempo para pagarla</span><strong data-out="months" aria-live="polite">—</strong></div><div class="out"><span>Interés total que pagarás</span><strong data-out="interest" aria-live="polite">—</strong></div><div class="out"><span>Pago para terminar en tus meses</span><strong data-out="needed" aria-live="polite">—</strong></div><p class="small priv">🔒 Privado: todo se calcula en tu dispositivo.</p></div></section>

</main><script src="/calc.js?v=5" defer></script></body></html>
