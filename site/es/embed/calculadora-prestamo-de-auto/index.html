<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de préstamo de auto | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/es/calculadora-prestamo-de-auto/"><link rel="stylesheet" href="/style.css?v=3">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="autoloan" novalidate><div class="f"><label for="autoloan-price">Precio del auto</label><div class="inp hp"><span class="pre">$</span><input id="autoloan-price" data-in="price" type="number" inputmode="decimal" step="100" min="0" value="32000"></div></div><div class="f"><label for="autoloan-down">Pago inicial</label><div class="inp hp"><span class="pre">$</span><input id="autoloan-down" data-in="down" type="number" inputmode="decimal" step="100" min="0" value="4000"></div></div><div class="f"><label for="autoloan-trade">Valor del auto que entregas</label><div class="inp hp"><span class="pre">$</span><input id="autoloan-trade" data-in="trade" type="number" inputmode="decimal" step="100" min="0" value="0"></div></div><div class="f"><label for="autoloan-tradetax">¿Tu estado cobra impuesto solo sobre la diferencia?</label><div class="inp"><select id="autoloan-tradetax" data-in="tradetax"><option value="yes" selected>Sí</option><option value="no">No</option></select></div></div><div class="f"><label for="autoloan-tax">Impuesto de venta</label><div class="inp hs"><input id="autoloan-tax" data-in="tax" type="number" inputmode="decimal" step="0.01" min="0" value="7"><span class="post">%</span></div></div><div class="f"><label for="autoloan-fees">Título, registro y cargos del concesionario</label><div class="inp hp"><span class="pre">$</span><input id="autoloan-fees" data-in="fees" type="number" inputmode="decimal" step="10" min="0" value="800"></div></div><div class="f"><label for="autoloan-apr">Tasa de interés (APR)</label><div class="inp hs"><input id="autoloan-apr" data-in="apr" type="number" inputmode="decimal" step="0.01" min="0" value="7.5"><span class="post">%</span></div></div><div class="f"><label for="autoloan-months">Plazo</label><div class="inp"><select id="autoloan-months" data-in="months"><option value="36">36 meses</option><option value="48">48 meses</option><option value="60" selected>60 meses</option><option value="72">72 meses</option><option value="84">84 meses</option></select></div></div>
<button class="btn wide" type="submit">Calcular</button></form>
<div class="results"><h2 class="sr">Resultados</h2><div class="out big"><span>Pago mensual</span><strong data-out="monthly" aria-live="polite">—</strong></div><div class="out"><span>Monto financiado</span><strong data-out="loanAmt" aria-live="polite">—</strong></div><div class="out"><span>Impuesto de venta</span><strong data-out="salesTax" aria-live="polite">—</strong></div><div class="out"><span>Interés total</span><strong data-out="interest" aria-live="polite">—</strong></div><div class="out"><span>Costo total del auto</span><strong data-out="total" aria-live="polite">—</strong></div><p class="small priv">🔒 Privado: todo se calcula en tu dispositivo.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/es/calculadora-prestamo-de-auto/" target="_blank" rel="noopener">Calculadora de préstamo de auto</a> · Calculadoras gratis en <a href="https://gethandycalcs.pages.dev/es/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=3" defer></script></body></html>
