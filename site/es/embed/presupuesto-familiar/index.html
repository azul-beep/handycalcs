<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presupuesto familiar | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/es/presupuesto-familiar/"><link rel="stylesheet" href="/style.css?v=4">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="budget" novalidate><div class="f"><label for="budget-income">Ingreso mensual neto</label><div class="inp hp"><span class="pre">$</span><input id="budget-income" data-in="income" type="number" inputmode="decimal" step="10" min="0" value="5200"></div></div><div class="f"><label for="budget-housing">Alquiler o hipoteca</label><div class="inp hp"><span class="pre">$</span><input id="budget-housing" data-in="housing" type="number" inputmode="decimal" step="10" min="0" value="1600"></div></div><div class="f"><label for="budget-utilities">Servicios, teléfono, internet</label><div class="inp hp"><span class="pre">$</span><input id="budget-utilities" data-in="utilities" type="number" inputmode="decimal" step="10" min="0" value="320"></div></div><div class="f"><label for="budget-groceries">Supermercado</label><div class="inp hp"><span class="pre">$</span><input id="budget-groceries" data-in="groceries" type="number" inputmode="decimal" step="10" min="0" value="750"></div></div><div class="f"><label for="budget-transport">Auto, gasolina, transporte</label><div class="inp hp"><span class="pre">$</span><input id="budget-transport" data-in="transport" type="number" inputmode="decimal" step="10" min="0" value="450"></div></div><div class="f"><label for="budget-insurance">Seguros y salud</label><div class="inp hp"><span class="pre">$</span><input id="budget-insurance" data-in="insurance" type="number" inputmode="decimal" step="10" min="0" value="380"></div></div><div class="f"><label for="budget-debt">Pagos de deudas</label><div class="inp hp"><span class="pre">$</span><input id="budget-debt" data-in="debt" type="number" inputmode="decimal" step="10" min="0" value="250"></div></div><div class="f"><label for="budget-childcare">Cuidado de niños y escuela</label><div class="inp hp"><span class="pre">$</span><input id="budget-childcare" data-in="childcare" type="number" inputmode="decimal" step="10" min="0" value="400"></div></div><div class="f"><label for="budget-other">Todo lo demás</label><div class="inp hp"><span class="pre">$</span><input id="budget-other" data-in="other" type="number" inputmode="decimal" step="10" min="0" value="500"></div></div>
<button class="btn wide" type="submit">Calcular</button></form>
<div class="results"><h2 class="sr">Resultados</h2><div class="out big"><span>Te queda por mes</span><strong data-out="left" aria-live="polite">—</strong></div><div class="out"><span>Gastos totales</span><strong data-out="spent" aria-live="polite">—</strong></div><div class="out"><span>Porcentaje del ingreso gastado</span><strong data-out="spentPct" aria-live="polite">—</strong></div><div class="out"><span>Porcentaje en vivienda</span><strong data-out="housingPct" aria-live="polite">—</strong></div><p class="small priv">🔒 Privado: todo se calcula en tu dispositivo.</p></div></section>

</main><script src="/calc.js?v=4" defer></script></body></html>
