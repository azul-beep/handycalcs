<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de IMC | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/es/calculadora-imc/"><link rel="stylesheet" href="/style.css?v=6">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="bmi" novalidate><div class="f"><label for="bmi-ft">Altura (pies)</label><div class="inp"><input id="bmi-ft" data-in="ft" type="number" inputmode="decimal" step="1" min="0" value="5"></div></div><div class="f"><label for="bmi-inch">Altura (pulgadas)</label><div class="inp"><input id="bmi-inch" data-in="inch" type="number" inputmode="decimal" step="0.5" min="0" value="7"></div></div><div class="f"><label for="bmi-lb">Peso (libras)</label><div class="inp"><input id="bmi-lb" data-in="lb" type="number" inputmode="decimal" step="0.5" min="0" value="160"></div></div>
<button class="btn wide" type="submit">Calcular</button></form>
<div class="results"><h2 class="sr">Resultados</h2><div class="out big"><span>Tu IMC</span><strong data-out="bmi" aria-live="polite">—</strong></div><div class="out"><span>Categoría</span><strong data-out="cat" aria-live="polite">—</strong></div><div class="out"><span>Peso saludable para tu altura</span><strong data-out="range" aria-live="polite">—</strong></div><div class="out"><span>En sistema métrico</span><strong data-out="metric" aria-live="polite">—</strong></div><p class="small priv">🔒 Privado: todo se calcula en tu dispositivo.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/es/calculadora-imc/" target="_blank" rel="noopener">Calculadora de IMC</a> · Calculadoras gratis en <a href="https://gethandycalcs.pages.dev/es/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=6" defer></script></body></html>
