<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de pies cuadrados | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/es/calculadora-de-pies-cuadrados/"><link rel="stylesheet" href="/style.css?v=6">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="sqft" novalidate><div class="f"><label for="sqft-length">Largo</label><div class="inp"><input id="sqft-length" data-in="length" type="number" inputmode="decimal" step="0.1" min="0" value="12"></div></div><div class="f"><label for="sqft-width">Ancho</label><div class="inp"><input id="sqft-width" data-in="width" type="number" inputmode="decimal" step="0.1" min="0" value="10"></div></div><div class="f"><label for="sqft-unit">Unidad</label><div class="inp"><select id="sqft-unit" data-in="unit"><option value="ft" selected>Pies</option><option value="in">Pulgadas</option><option value="yd">Yardas</option><option value="m">Metros</option></select></div></div><div class="f"><label for="sqft-count">Cantidad de ambientes iguales</label><div class="inp"><input id="sqft-count" data-in="count" type="number" inputmode="decimal" step="1" min="1" value="1"></div></div><div class="f"><label for="sqft-waste">Extra por cortes y desperdicio</label><div class="inp hs"><input id="sqft-waste" data-in="waste" type="number" inputmode="decimal" step="1" min="0" value="10"><span class="post">%</span></div></div><div class="f"><label for="sqft-cost">Precio por pie cuadrado (opcional)</label><div class="inp hp"><span class="pre">$</span><input id="sqft-cost" data-in="cost" type="number" inputmode="decimal" step="0.01" min="0" value="0"></div></div>
<button class="btn wide" type="submit">Calcular</button></form>
<div class="results"><h2 class="sr">Resultados</h2><div class="out big"><span>Superficie</span><strong data-out="area" aria-live="polite">—</strong></div><div class="out"><span>En metros y yardas cuadradas</span><strong data-out="metric" aria-live="polite">—</strong></div><div class="out"><span>Material a comprar (con extra)</span><strong data-out="buy" aria-live="polite">—</strong></div><div class="out"><span>Costo del material</span><strong data-out="cost" aria-live="polite">—</strong></div><p class="small priv">🔒 Privado: todo se calcula en tu dispositivo.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/es/calculadora-de-pies-cuadrados/" target="_blank" rel="noopener">Calculadora de pies cuadrados</a> · Calculadoras gratis en <a href="https://gethandycalcs.pages.dev/es/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=6" defer></script></body></html>
