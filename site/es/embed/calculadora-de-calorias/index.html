<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de calorías | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/es/calculadora-de-calorias/"><link rel="stylesheet" href="/style.css?v=3">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="calorie" novalidate><div class="f"><label for="calorie-sex">Sexo</label><div class="inp"><select id="calorie-sex" data-in="sex"><option value="f" selected>Mujer</option><option value="m">Hombre</option></select></div></div><div class="f"><label for="calorie-age">Edad</label><div class="inp"><input id="calorie-age" data-in="age" type="number" inputmode="decimal" step="1" min="15" value="35"></div></div><div class="f"><label for="calorie-ft">Altura (pies)</label><div class="inp"><input id="calorie-ft" data-in="ft" type="number" inputmode="decimal" step="1" min="0" value="5"></div></div><div class="f"><label for="calorie-inch">Altura (pulgadas)</label><div class="inp"><input id="calorie-inch" data-in="inch" type="number" inputmode="decimal" step="0.5" min="0" value="5"></div></div><div class="f"><label for="calorie-lb">Peso (libras)</label><div class="inp"><input id="calorie-lb" data-in="lb" type="number" inputmode="decimal" step="0.5" min="0" value="150"></div></div><div class="f"><label for="calorie-activity">Nivel de actividad</label><div class="inp"><select id="calorie-activity" data-in="activity"><option value="1.2">Sedentario (poco o nada de ejercicio)</option><option value="1.375" selected>Liviano (ejercicio 1 a 3 días por semana)</option><option value="1.55">Moderado (ejercicio 3 a 5 días por semana)</option><option value="1.725">Activo (ejercicio fuerte 6 a 7 días)</option><option value="1.9">Muy activo (trabajo físico y entrenamiento)</option></select></div></div>
<button class="btn wide" type="submit">Calcular</button></form>
<div class="results"><h2 class="sr">Resultados</h2><div class="out big"><span>Calorías para mantener el peso</span><strong data-out="tdee" aria-live="polite">—</strong></div><div class="out"><span>Bajar unas 0,5 lb por semana</span><strong data-out="lose05" aria-live="polite">—</strong></div><div class="out"><span>Bajar unas 1 lb por semana</span><strong data-out="lose1" aria-live="polite">—</strong></div><div class="out"><span>Subir unas 0,5 lb por semana</span><strong data-out="gain" aria-live="polite">—</strong></div><div class="out"><span>Calorías en reposo (metabolismo basal)</span><strong data-out="bmr" aria-live="polite">—</strong></div><p class="small priv">🔒 Privado: todo se calcula en tu dispositivo.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/es/calculadora-de-calorias/" target="_blank" rel="noopener">Calculadora de calorías</a> · Calculadoras gratis en <a href="https://gethandycalcs.pages.dev/es/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=3" defer></script></body></html>
