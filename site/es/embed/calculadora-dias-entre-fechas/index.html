<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<body><main class="wrap"><section class="card calc"><form data-calc="datediff" novalidate><div class="f"><label for="datediff-start">Fecha de inicio</label><div class="inp"><input id="datediff-start" data-in="start" type="date" value="" data-today="1"></div></div><div class="f"><label for="datediff-end">Fecha de fin</label><div class="inp"><input id="datediff-end" data-in="end" type="date" value="2026-12-25"></div></div><div class="f"><label for="datediff-incl">¿Contar también el último día?</label><div class="inp"><select id="datediff-incl" data-in="incl"><option value="no" selected>No</option><option value="yes">Sí</option></select></div></div>

<div class="results"><h2 class="sr">Resultados</h2><div class="out big"><span>Días entre las fechas</span><strong data-out="days" aria-live="polite">—</strong></div><div class="out"><span>En semanas</span><strong data-out="weeks" aria-live="polite">—</strong></div><div class="out"><span>En meses y años</span><strong data-out="months" aria-live="polite">—</strong></div><div class="out"><span>Días hábiles</span><strong data-out="work" aria-live="polite">—</strong></div><p class="small priv">🔒 Privado: todo se calcula en tu dispositivo.</p></div></section>
