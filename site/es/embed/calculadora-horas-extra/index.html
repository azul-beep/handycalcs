<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de horas extra | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/es/calculadora-horas-extra/"><link rel="stylesheet" href="/style.css?v=4">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="overtime" novalidate><div class="f"><label for="overtime-rate">Pago por hora normal</label><div class="inp hp"><span class="pre">$</span><input id="overtime-rate" data-in="rate" type="number" inputmode="decimal" step="0.01" min="0" value="18"></div></div><div class="f"><label for="overtime-reg">Horas normales</label><div class="inp"><input id="overtime-reg" data-in="reg" type="number" inputmode="decimal" step="0.25" min="0" value="40"></div></div><div class="f"><label for="overtime-ot">Horas extra</label><div class="inp"><input id="overtime-ot" data-in="ot" type="number" inputmode="decimal" step="0.25" min="0" value="6"></div></div><div class="f"><label for="overtime-mult">Recargo de horas extra</label><div class="inp"><select id="overtime-mult" data-in="mult"><option value="1.5" selected>Tiempo y medio (1,5×)</option><option value="2">Doble (2×)</option></select></div></div>
<button class="btn wide" type="submit">Calcular</button></form>
<div class="results"><h2 class="sr">Resultados</h2><div class="out big"><span>Pago total</span><strong data-out="total" aria-live="polite">—</strong></div><div class="out"><span>Pago por hora extra</span><strong data-out="otRate" aria-live="polite">—</strong></div><div class="out"><span>Pago normal</span><strong data-out="regPay" aria-live="polite">—</strong></div><div class="out"><span>Pago de horas extra</span><strong data-out="otPay" aria-live="polite">—</strong></div><p class="small priv">🔒 Privado: todo se calcula en tu dispositivo.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/es/calculadora-horas-extra/" target="_blank" rel="noopener">Calculadora de horas extra</a> · Calculadoras gratis en <a href="https://gethandycalcs.pages.dev/es/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=4" defer></script></body></html>
