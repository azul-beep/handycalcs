<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de GPA | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/es/calculadora-de-gpa/"><link rel="stylesheet" href="/style.css?v=3">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="gpa" novalidate><div class="f"><label for="gpa-list">Una materia por línea: nota y créditos</label><textarea id="gpa-list" data-in="list" rows="6" spellcheck="false">Inglés, A, 3
Álgebra, B+, 4
Biología, A-, 4
Historia, B, 3
Arte, A, 1</textarea></div><div class="f"><label for="gpa-prevgpa">GPA acumulado actual (opcional)</label><div class="inp"><input id="gpa-prevgpa" data-in="prevgpa" type="number" inputmode="decimal" step="0.01" min="0" value="0"></div></div><div class="f"><label for="gpa-prevcr">Créditos ya aprobados (opcional)</label><div class="inp"><input id="gpa-prevcr" data-in="prevcr" type="number" inputmode="decimal" step="1" min="0" value="0"></div></div>
<button class="btn wide" type="submit">Calcular</button></form>
<div class="results"><h2 class="sr">Resultados</h2><div class="out big"><span>GPA de estas materias</span><strong data-out="gpa" aria-live="polite">—</strong></div><div class="out"><span>Nuevo GPA acumulado</span><strong data-out="cum" aria-live="polite">—</strong></div><div class="out"><span>Créditos contados</span><strong data-out="credits" aria-live="polite">—</strong></div><p class="small priv">🔒 Privado: todo se calcula en tu dispositivo.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/es/calculadora-de-gpa/" target="_blank" rel="noopener">Calculadora de GPA</a> · Calculadoras gratis en <a href="https://gethandycalcs.pages.dev/es/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=3" defer></script></body></html>
