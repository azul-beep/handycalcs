<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de porcentajes | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/es/calculadora-de-porcentajes/"><link rel="stylesheet" href="/style.css?v=5">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="percent" novalidate><div class="f"><label for="percent-mode">¿Qué quieres saber?</label><div class="inp"><select id="percent-mode" data-in="mode"><option value="of" selected>¿Cuánto es A% de B?</option><option value="is">¿Qué % de B es A?</option><option value="chg">Variación % de A a B</option></select></div></div><div class="f"><label for="percent-a">A</label><div class="inp"><input id="percent-a" data-in="a" type="number" inputmode="decimal" step="any" min="-1e12" value="15"></div></div><div class="f"><label for="percent-b">B</label><div class="inp"><input id="percent-b" data-in="b" type="number" inputmode="decimal" step="any" min="-1e12" value="80"></div></div>
<button class="btn wide" type="submit">Calcular</button></form>
<div class="results"><h2 class="sr">Resultados</h2><div class="out big"><span>Resultado</span><strong data-out="result" aria-live="polite">—</strong></div><p class="small priv">🔒 Privado: todo se calcula en tu dispositivo.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/es/calculadora-de-porcentajes/" target="_blank" rel="noopener">Calculadora de porcentajes</a> · Calculadoras gratis en <a href="https://gethandycalcs.pages.dev/es/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=5" defer></script></body></html>
