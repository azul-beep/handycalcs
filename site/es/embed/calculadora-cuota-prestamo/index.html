<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuota de préstamo | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/es/calculadora-cuota-prestamo/"><link rel="stylesheet" href="/style.css?v=6">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="loan" novalidate><div class="f"><label for="loan-amount">Monto del préstamo</label><div class="inp hp"><span class="pre">$</span><input id="loan-amount" data-in="amount" type="number" inputmode="decimal" step="100" min="0" value="20000"></div></div><div class="f"><label for="loan-apr">Tasa de interés anual (APR)</label><div class="inp hs"><input id="loan-apr" data-in="apr" type="number" inputmode="decimal" step="0.05" min="0" value="7.5"><span class="post">%</span></div></div><div class="f"><label for="loan-years">Plazo en años</label><div class="inp"><input id="loan-years" data-in="years" type="number" inputmode="decimal" step="0.5" min="0" value="5"></div></div>
<button class="btn wide" type="submit">Calcular</button></form>
<div class="results"><h2 class="sr">Resultados</h2><div class="out big"><span>Cuota mensual</span><strong data-out="monthly" aria-live="polite">—</strong></div><div class="out"><span>Interés total</span><strong data-out="interest" aria-live="polite">—</strong></div><div class="out"><span>Total pagado</span><strong data-out="total" aria-live="polite">—</strong></div><p class="small priv">🔒 Privado: todo se calcula en tu dispositivo.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/es/calculadora-cuota-prestamo/" target="_blank" rel="noopener">Cuota de préstamo</a> · Calculadoras gratis en <a href="https://gethandycalcs.pages.dev/es/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=6" defer></script></body></html>
