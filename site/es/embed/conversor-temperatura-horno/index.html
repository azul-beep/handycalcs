<body><main class="wrap"><section class="card calc"><form data-calc="oven" novalidate><div class="f"><label for="oven-temp">Temperatura</label><div class="inp"><input id="oven-temp" data-in="temp" type="number" inputmode="decimal" step="1" min="-100" value="350"></div></div><div class="chips" role="group"><button type="button" class="chip" data-set="oven-temp" data-val="325">325</button><button type="button" class="chip" data-set="oven-temp" data-val="350">350</button><button type="button" class="chip" data-set="oven-temp" data-val="375">375</button><button type="button" class="chip" data-set="oven-temp" data-val="400">400</button><button type="button" class="chip" data-set="oven-temp" data-val="425">425</button></div><div class="f"><label for="oven-dir">Convertir</label><div class="inp"><select id="oven-dir" data-in="dir"><option value="f2c" selected>°F → °C</option><option value="c2f">°C → °F</option></select></div></div>
