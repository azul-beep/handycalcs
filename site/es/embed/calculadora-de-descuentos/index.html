<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de descuentos | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/es/calculadora-de-descuentos/"><link rel="stylesheet" href="/style.css?v=3">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="discount" novalidate><div class="f"><label for="discount-price">Precio original</label><div class="inp hp"><span class="pre">$</span><input id="discount-price" data-in="price" type="number" inputmode="decimal" step="0.01" min="0" value="80"></div></div><div class="f"><label for="discount-off">Descuento</label><div class="inp hs"><input id="discount-off" data-in="off" type="number" inputmode="decimal" step="1" min="0" value="25"><span class="post">%</span></div></div><div class="chips" role="group"><button type="button" class="chip" data-set="discount-off" data-val="10">10%</button><button type="button" class="chip" data-set="discount-off" data-val="20">20%</button><button type="button" class="chip" data-set="discount-off" data-val="25">25%</button><button type="button" class="chip" data-set="discount-off" data-val="30">30%</button><button type="button" class="chip" data-set="discount-off" data-val="50">50%</button></div><div class="f"><label for="discount-tax">Impuesto (opcional)</label><div class="inp hs"><input id="discount-tax" data-in="tax" type="number" inputmode="decimal" step="0.01" min="0" value="0"><span class="post">%</span></div></div>
<button class="btn wide" type="submit">Calcular</button></form>
<div class="results"><h2 class="sr">Resultados</h2><div class="out big"><span>Pagas</span><strong data-out="total" aria-live="polite">—</strong></div><div class="out"><span>Ahorras</span><strong data-out="save" aria-live="polite">—</strong></div><div class="out"><span>Precio con descuento</span><strong data-out="after" aria-live="polite">—</strong></div><div class="out"><span>Impuesto</span><strong data-out="tax" aria-live="polite">—</strong></div><p class="small priv">🔒 Privado: todo se calcula en tu dispositivo.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/es/calculadora-de-descuentos/" target="_blank" rel="noopener">Calculadora de descuentos</a> · Calculadoras gratis en <a href="https://gethandycalcs.pages.dev/es/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=3" defer></script></body></html>
