<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de interés compuesto | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/es/calculadora-interes-compuesto/"><link rel="stylesheet" href="/style.css?v=6">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="compound" novalidate><div class="f"><label for="compound-initial">Depósito inicial</label><div class="inp hp"><span class="pre">$</span><input id="compound-initial" data-in="initial" type="number" inputmode="decimal" step="100" min="0" value="5000"></div></div><div class="f"><label for="compound-monthly">Aporte mensual</label><div class="inp hp"><span class="pre">$</span><input id="compound-monthly" data-in="monthly" type="number" inputmode="decimal" step="10" min="0" value="200"></div></div><div class="f"><label for="compound-rate">Tasa de interés anual</label><div class="inp hs"><input id="compound-rate" data-in="rate" type="number" inputmode="decimal" step="0.1" min="0" value="7"><span class="post">%</span></div></div><div class="f"><label for="compound-years">Años</label><div class="inp"><input id="compound-years" data-in="years" type="number" inputmode="decimal" step="1" min="0" value="20"></div></div><div class="f"><label for="compound-freq">Capitalización</label><div class="inp"><select id="compound-freq" data-in="freq"><option value="12" selected>Mensual</option><option value="365">Diaria</option><option value="4">Trimestral</option><option value="1">Anual</option></select></div></div>
<button class="btn wide" type="submit">Calcular</button></form>
<div class="results"><h2 class="sr">Resultados</h2><div class="out big"><span>Valor final</span><strong data-out="fv" aria-live="polite">—</strong></div><div class="out"><span>Total que aportaste</span><strong data-out="contrib" aria-live="polite">—</strong></div><div class="out"><span>Intereses ganados</span><strong data-out="earned" aria-live="polite">—</strong></div><div class="out"><span>Años para duplicar (regla del 72)</span><strong data-out="doubling" aria-live="polite">—</strong></div><p class="small priv">🔒 Privado: todo se calcula en tu dispositivo.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/es/calculadora-interes-compuesto/" target="_blank" rel="noopener">Calculadora de interés compuesto</a> · Calculadoras gratis en <a href="https://gethandycalcs.pages.dev/es/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=6" defer></script></body></html>
