<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de nota final | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/es/calculadora-nota-final/"><link rel="stylesheet" href="/style.css?v=6">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="finalgrade" novalidate><div class="f"><label for="finalgrade-current">Nota actual en la materia</label><div class="inp hs"><input id="finalgrade-current" data-in="current" type="number" inputmode="decimal" step="0.1" min="0" value="85"><span class="post">%</span></div></div><div class="f"><label for="finalgrade-want">Nota que quieres al final</label><div class="inp hs"><input id="finalgrade-want" data-in="want" type="number" inputmode="decimal" step="0.1" min="0" value="90"><span class="post">%</span></div></div><div class="chips" role="group"><button type="button" class="chip" data-set="finalgrade-want" data-val="70">70%</button><button type="button" class="chip" data-set="finalgrade-want" data-val="80">80%</button><button type="button" class="chip" data-set="finalgrade-want" data-val="90">90%</button></div><div class="f"><label for="finalgrade-weight">Peso del examen final</label><div class="inp hs"><input id="finalgrade-weight" data-in="weight" type="number" inputmode="decimal" step="1" min="0" value="25"><span class="post">%</span></div></div>
<button class="btn wide" type="submit">Calcular</button></form>
<div class="results"><h2 class="sr">Resultados</h2><div class="out big"><span>Necesitas en el final</span><strong data-out="need" aria-live="polite">—</strong></div><div class="out"><span>¿Se puede?</span><strong data-out="note" aria-live="polite">—</strong></div><div class="out"><span>Nota final si sacas 0</span><strong data-out="ifzero" aria-live="polite">—</strong></div><div class="out"><span>Nota final si sacas 100</span><strong data-out="ifhundred" aria-live="polite">—</strong></div><p class="small priv">🔒 Privado: todo se calcula en tu dispositivo.</p></div></section>
<p class="embed-credit"><a href="https://gethandycalcs.pages.dev/es/calculadora-nota-final/" target="_blank" rel="noopener">Calculadora de nota final</a> · Calculadoras gratis en <a href="https://gethandycalcs.pages.dev/es/" target="_blank" rel="noopener">Handy Calcs</a></p>
</main><script src="/calc.js?v=6" defer></script></body></html>
