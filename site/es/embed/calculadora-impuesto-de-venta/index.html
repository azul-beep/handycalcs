<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de sales tax | Handy Calcs</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://gethandycalcs.pages.dev/es/calculadora-impuesto-de-venta/"><link rel="stylesheet" href="/style.css?v=3">
<style>body{background:transparent}.wrap{padding:8px}.embed-credit{text-align:center;font-size:13px;margin:8px 0}</style></head>
<body><main class="wrap"><section class="card calc"><form data-calc="salestax" novalidate><div class="f"><label for="salestax-mode">Modo</label><div class="inp"><select id="salestax-mode" data-in="mode"><option value="add" selected>Sumar impuesto a un precio</option><option value="remove">Sacar el impuesto de un total</option></select></div></div><div class="f"><label for="salestax-amount">Monto</label><div class="inp hp"><span class="pre">$</span><input id="salestax-amount" data-in="amount" type="number" inputmode="decimal" step="0.01" min="0" value="100"></div></div><div class="f"><label for="salestax-rate">Tasa de impuesto</label><div class="inp hs"><input id="salestax-rate" data-in="rate" type="number" inputmode="decimal" step="0.01" min="0" value="7.25"><span class="post">%</span></div></div>
<button class="btn wide" type="submit">Calcular</button></form>
<div class="results"><h2 class="sr">Resultados</h2><div class="out big"><span>Total con impuesto</span><strong data-out="total" aria-live="polite">—</strong></div><div class="out"><span>Impuesto</span><strong data-out="tax" aria-live="polite">—</strong></div><div class="out"><span>Precio sin impuesto</span><strong data-out="pre" aria-live="polite">—</strong></div><p class="small priv">🔒 Privado: todo se calcula en tu dispositivo.</p></div></section>
