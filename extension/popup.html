<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
<body>
<header><strong>Handy Calcs</strong><button id="lang" type="button">ES</button></header>
<label id="l-bill">Bill</label><div class="i"><span>$</span><input id="bill" type="number" inputmode="decimal" value="50" step="0.01"></div>
<label id="l-tip">Tip %</label><div class="chips" id="chips"></div>
<input id="tip" type="number" value="20" step="0.5">
<label id="l-people">People</label><input id="people" type="number" value="1" min="1" step="1">
<div class="out"><div><span id="o-tip">Tip</span><b id="tipv">—</b></div><div><span id="o-total">Total</span><b id="totv">—</b></div><div class="big"><span id="o-each">Each pays</span><b id="eachv">—</b></div></div>
<nav id="links"></nav>
<script src="popup.js"></script>
</body></html>
