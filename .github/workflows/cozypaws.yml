# Cozy Paws (tienda de Etsy de mascotas): web de guías de regalos + calculadoras + RSS para Pinterest.
# Corre sola todos los días, gratis y sin Claude:
#   - 2 PM de Utah (21:00 UTC): build.py suelta los productos del día del calendario de Etsy (5 por día; para esa hora ya están cargados),
#     una guía nueva como mucho por día y las herramientas en su fecha; rearma feed.xml y sitemap.
#   - commit -> Cloudflare Pages (proyecto "cozypawsgifts", carpeta cozypaws/site) publica solo
#     -> Pinterest lee feed.xml y crea los pines solo.
name: Cozy Paws (publicación diaria)
run-name: ${{ (inputs.turno || github.event.schedule) && format('Turno {0}', inputs.turno || github.event.schedule) || github.workflow }}
on:
  schedule:
    - cron: "0 21 * * *"
  push:
    branches: [main]
    paths: ["cozypaws/data/**", "cozypaws/build.py", "cozypaws/contenido.py", "cozypaws/apps/**", "cozypaws/articulos/**", "afiliados.json", "afiliados.py"]
  workflow_dispatch:
    inputs:
      turno: { description: "Lo usa el despertador (dejar vacío a mano)", default: "" }
permissions:
  actions: read
  contents: write
concurrency:
  group: handycalcs-publicacion
  cancel-in-progress: false
jobs:
  turno:
    # Despertador: el mismo turno puede llegar dos veces (el despertador de Cloudflare a horario y el cron de GitHub
    # atrasado). Corre solo el primero; el segundo termina en verde sin hacer nada. Corridas a mano: siempre corren.
    runs-on: ubuntu-latest
    outputs:
      correr: ${{ steps.ver.outputs.correr }}
    steps:
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          TURNO: ${{ inputs.turno || github.event.schedule }}
        run: |
          if [ -z "$TURNO" ]; then echo "correr=si" >> "$GITHUB_OUTPUT"; exit 0; fi
          wf=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id) || { echo "No pude revisar turnos anteriores: corre igual."; echo "correr=si" >> "$GITHUB_OUTPUT"; exit 0; }
          desde=$(date -u -d '-14 hours' +%FT%TZ)
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?created=%3E%3D$desde&status=success&per_page=100" \
                --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .display_title == \"Turno $TURNO\")] | length") || n=0
          if [ "${n:-0}" -gt 0 ]; then
            echo "El turno '$TURNO' ya corrió en las últimas 14 horas: no se repite."
            echo "correr=no" >> "$GITHUB_OUTPUT"
          else
            echo "correr=si" >> "$GITHUB_OUTPUT"
          fi
  publicar:
    needs: turno
    if: needs.turno.outputs.correr == 'si'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y fonts-dejavu-core
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - name: Rearmar la web de Cozy Paws
        run: python3 cozypaws/build.py
      - name: Commit si hay algo nuevo
        run: |
          if git diff --quiet -- cozypaws && [ -z "$(git ls-files --others --exclude-standard cozypaws)" ]; then
            echo "Hoy no sale nada nuevo"; exit 0
          fi
          git config user.name "publicacion-bot"
          git config user.email "publicacion-bot@users.noreply.github.com"
          git add cozypaws
          git commit -m "Cozy Paws: publicación diaria $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done; exit 1
