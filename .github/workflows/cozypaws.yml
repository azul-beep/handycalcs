# Cozy Paws (tienda de Etsy de mascotas): web de guías de regalos + calculadoras + RSS para Pinterest.
# Corre sola todos los días, gratis y sin Claude:
#   - 2 PM de Utah (21:00 UTC): build.py suelta los productos del día del calendario de Etsy (5 por día; para esa hora ya están cargados),
#     una guía nueva como mucho por día y las herramientas en su fecha; rearma feed.xml y sitemap.
#   - commit -> Cloudflare Pages (proyecto "cozypawsgifts", carpeta cozypaws/site) publica solo
#     -> Pinterest lee feed.xml y crea los pines solo.
name: Cozy Paws (publicación diaria)
on:
  schedule:
    - cron: "0 21 * * *"
  push:
    branches: [main]
    paths: ["cozypaws/data/**", "cozypaws/build.py", "cozypaws/contenido.py", "cozypaws/apps/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: handycalcs-publicacion
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y fonts-dejavu-core
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - name: Rearmar la web de Cozy Paws
        run: python3 cozypaws/build.py
      - name: Commit si hay algo nuevo
        run: |
          if git diff --quiet -- cozypaws && [ -z "$(git ls-files --others --exclude-standard cozypaws)" ]; then
            echo "Hoy no sale nada nuevo"; exit 0
          fi
          git config user.name "publicacion-bot"
          git config user.email "publicacion-bot@users.noreply.github.com"
          git add cozypaws
          git commit -m "Cozy Paws: publicación diaria $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done; exit 1
