# Día 1 de cada mes: revisa los links y los datos (precios, límites) de la guía de herramientas gratis.
# Si hay links rotos o cambió un dato clave, falla y GitHub le manda un mail a Azu.
name: Herramientas - chequeo mensual
on:
  schedule:
    - cron: "0 15 1 * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: handycalcs-publicacion
  cancel-in-progress: false
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 herramientas/revisar_links.py --html site/herramientas-gratis
      - if: always()
        run: |
          git config user.name "revisor-bot"
          git config user.email "revisor-bot@users.noreply.github.com"
          git add herramientas/informes herramientas/estado_links.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Chequeo mensual de links" && git push)
