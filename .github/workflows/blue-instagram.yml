# Blue en Automático: publica sola 2 reels por día en Instagram (API oficial de Meta, gratis, sin Claude).
# 12 PM y 7 PM de Utah (19:00 y 02:00 UTC). Los videos esperan en la rama "blue-videos" (cola.json + .mp4);
# cada uno sale cuando llega su fecha y se borra de la rama. Si quedan menos de 4, abre el issue "🎬 Blue: quedan N videos".
# Mientras no estén los secretos BLUE_IG_USER_ID y BLUE_FB_TOKEN, termina en verde sin publicar.
# A mano: Actions > Blue (Instagram) > Run workflow con "publicar" o "revisar" (prueba la clave y la cola, sin publicar).
# Código y pasos: blue/videos.py y blue/LEEME.md
name: Blue (Instagram)
run-name: ${{ (inputs.turno || github.event.schedule) && format('Turno {0}', inputs.turno || github.event.schedule) || github.workflow }}
on:
  schedule:
    - cron: "0 19 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      turno: { description: "Lo usa el despertador (dejar vacío a mano)", default: "" }
      accion: { description: "publicar o revisar", default: "publicar" }
permissions:
  actions: read
  contents: write
  issues: write
concurrency:
  group: blue-instagram
  cancel-in-progress: false
jobs:
  turno:
    # Despertador: el mismo turno puede llegar dos veces (el despertador de Cloudflare a horario y el cron de GitHub
    # atrasado). Corre solo el primero; el segundo termina en verde sin hacer nada. Corridas a mano: siempre corren.
    runs-on: ubuntu-latest
    outputs:
      correr: ${{ steps.ver.outputs.correr }}
    steps:
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          TURNO: ${{ inputs.turno || github.event.schedule }}
        run: |
          if [ -z "$TURNO" ]; then echo "correr=si" >> "$GITHUB_OUTPUT"; exit 0; fi
          wf=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id) || { echo "No pude revisar turnos anteriores: corre igual."; echo "correr=si" >> "$GITHUB_OUTPUT"; exit 0; }
          desde=$(date -u -d '-14 hours' +%FT%TZ)
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?created=%3E%3D$desde&status=success&per_page=100" \
                --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .display_title == \"Turno $TURNO\")] | length") || n=0
          if [ "${n:-0}" -gt 0 ]; then
            echo "El turno '$TURNO' ya corrió en las últimas 14 horas: no se repite."
            echo "correr=no" >> "$GITHUB_OUTPUT"
          else
            echo "correr=si" >> "$GITHUB_OUTPUT"
          fi
  publicar:
    needs: turno
    if: needs.turno.outputs.correr == 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLUE_IG_USER_ID: ${{ secrets.BLUE_IG_USER_ID }}
      BLUE_FB_TOKEN: ${{ secrets.BLUE_FB_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 blue/videos.py ${{ inputs.turno && 'publicar' || inputs.accion || 'publicar' }}
