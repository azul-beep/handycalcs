# Cozy Paws en redes: publica solo en Instagram y Facebook (y Threads si tiene token) con las APIs oficiales de Meta (gratis, sin Claude).
# Ritmo por día (hora de Utah): 10 AM producto nuevo + historia, 1 PM post del banco (tip, frase, Social Club o pregunta), 6 PM producto nuevo.
# Cada artículo nuevo del blog se recicla solo: ocupa el post de la 1 PM y la historia de las 10 AM (no suma publicaciones).
# Lunes: renueva el token de Threads. A mano (Actions > Cozy Paws (redes) > Run workflow): publicar, contenido, historia, revisar o renovar.
# Si una red no tiene su secret cargado, se saltea. Si algo falla, la corrida queda en rojo y GitHub avisa por mail.
name: Cozy Paws (redes)
run-name: ${{ (inputs.turno || github.event.schedule) && format('Turno {0}', inputs.turno || github.event.schedule) || github.workflow }}
on:
  schedule:
    - cron: "0 17 * * *"
    - cron: "0 1 * * *"
    - cron: "0 20 * * *"
    - cron: "20 16 * * 1"
  workflow_dispatch:
    inputs:
      turno: { description: "Lo usa el despertador (dejar vacío a mano)", default: "" }
      accion: { description: "publicar, contenido, historia, revisar o renovar", default: "publicar" }
permissions:
  actions: read
  contents: write
concurrency:
  group: cozypaws-redes
  cancel-in-progress: false
jobs:
  turno:
    # Despertador: el mismo turno puede llegar dos veces (el despertador de Cloudflare a horario y el cron de GitHub
    # atrasado). Corre solo el primero; el segundo termina en verde sin hacer nada. Corridas a mano: siempre corren.
    runs-on: ubuntu-latest
    outputs:
      correr: ${{ steps.ver.outputs.correr }}
    steps:
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          TURNO: ${{ inputs.turno || github.event.schedule }}
        run: |
          if [ -z "$TURNO" ]; then echo "correr=si" >> "$GITHUB_OUTPUT"; exit 0; fi
          wf=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id) || { echo "No pude revisar turnos anteriores: corre igual."; echo "correr=si" >> "$GITHUB_OUTPUT"; exit 0; }
          desde=$(date -u -d '-14 hours' +%FT%TZ)
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?created=%3E%3D$desde&status=success&per_page=100" \
                --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .display_title == \"Turno $TURNO\")] | length") || n=0
          if [ "${n:-0}" -gt 0 ]; then
            echo "El turno '$TURNO' ya corrió en las últimas 14 horas: no se repite."
            echo "correr=no" >> "$GITHUB_OUTPUT"
          else
            echo "correr=si" >> "$GITHUB_OUTPUT"
          fi
  redes:
    needs: turno
    if: needs.turno.outputs.correr == 'si'
    runs-on: ubuntu-latest
    env:
      THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Publicar
        run: |
          turno="${{ inputs.turno || github.event.schedule }}"
          acc=""
          [ -z "$turno" ] && acc="${{ inputs.accion }}"
          if [ -z "$acc" ]; then
            case "$turno" in
              "20 16 * * 1") acc="renovar" ;;
              "0 20 * * *") acc="contenido" ;;
              "0 17 * * *") acc="publicar historia" ;;
              *) acc="publicar" ;;
            esac
          fi
          fallo=0
          for a in $acc; do python3 cozypaws/social.py $a || fallo=1; done
          exit $fallo
      - name: Guardar lo publicado
        if: always()
        run: |
          [ -z "$(git status --porcelain -- cozypaws/data/redes-publicado.json)" ] && exit 0
          git config user.name "publicacion-bot"
          git config user.email "publicacion-bot@users.noreply.github.com"
          git add cozypaws/data/redes-publicado.json
          git commit -m "Cozy Paws: redes $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done; exit 1
