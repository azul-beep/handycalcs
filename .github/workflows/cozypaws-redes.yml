# Cozy Paws en redes: publica solo en Instagram y Facebook (y Threads si tiene token) con las APIs oficiales de Meta (gratis, sin Claude).
# Ritmo por día (hora de Utah): 10 AM producto nuevo + historia, 1 PM post del banco (tip, frase, Social Club o pregunta), 6 PM producto nuevo.
# Lunes: renueva el token de Threads. A mano (Actions > Cozy Paws (redes) > Run workflow): publicar, contenido, historia, revisar o renovar.
# Si una red no tiene su secret cargado, se saltea. Si algo falla, la corrida queda en rojo y GitHub avisa por mail.
name: Cozy Paws (redes)
on:
  schedule:
    - cron: "0 17 * * *"
    - cron: "0 1 * * *"
    - cron: "0 20 * * *"
    - cron: "20 16 * * 1"
  workflow_dispatch:
    inputs:
      accion: { description: "publicar, contenido, historia, revisar o renovar", default: "publicar" }
permissions:
  contents: write
concurrency:
  group: handycalcs-publicacion
  cancel-in-progress: false
jobs:
  redes:
    runs-on: ubuntu-latest
    env:
      THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Publicar
        run: |
          acc="${{ inputs.accion }}"
          if [ -z "$acc" ]; then
            case "${{ github.event.schedule }}" in
              "20 16 * * 1") acc="renovar" ;;
              "0 20 * * *") acc="contenido" ;;
              "0 17 * * *") acc="publicar historia" ;;
              *) acc="publicar" ;;
            esac
          fi
          fallo=0
          for a in $acc; do python3 cozypaws/social.py $a || fallo=1; done
          exit $fallo
      - name: Guardar lo publicado
        if: always()
        run: |
          [ -z "$(git status --porcelain -- cozypaws/data/redes-publicado.json)" ] && exit 0
          git config user.name "publicacion-bot"
          git config user.email "publicacion-bot@users.noreply.github.com"
          git add cozypaws/data/redes-publicado.json
          git commit -m "Cozy Paws: redes $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done; exit 1
