# Publica la web de Blue (blueautomatica.pages.dev) cada vez que cambia blue/web/ en main.
# 1) Rearma los links cortos /ir/ (blue/herramientas.py -> blue/web/_redirects) y los guarda.
# 2) Sube blue/web al proyecto de Cloudflare Pages "blueautomatica" (subida directa, misma dirección de siempre).
# Gratis y sin Claude. Necesita UN secreto: CLOUDFLARE_API_TOKEN (permiso Account > Cloudflare Pages > Edit).
# Sin el secreto, solo rearma los links y no publica.
name: Blue (web)
on:
  push:
    branches: [main]
    paths: ["blue/web/**", "blue/herramientas.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: blue-web
  cancel-in-progress: false
env:
  CLOUDFLARE_ACCOUNT_ID: 9c7832de69ff3188e25ceb1711b362d5
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rearmar links cortos y guardarlos
        run: |
          git config user.name "publicacion-bot"
          git config user.email "publicacion-bot@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            python3 blue/herramientas.py
            if git diff --quiet -- blue/web/_redirects; then echo "Links al día"; exit 0; fi
            git add blue/web/_redirects
            git commit -m "Blue: links cortos al día $(date -u +%F)"
            git push origin HEAD:main && exit 0
            sleep 15
          done
          exit 1
      - name: Publicar en Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 pages deploy blue/web --project-name=blueautomatica --branch=main --commit-dirty=true
      - name: Aviso si falta el secreto
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::warning::Falta el secreto CLOUDFLARE_API_TOKEN, la web de Blue no se publico (ver blue/web/LEEME.md)."
