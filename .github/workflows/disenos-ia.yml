name: Disenos IA (gratis)
on:
  push:
    branches: [claude/project-thread-avh76e]
    paths: [disenos-ia/prompts.csv]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Generar imagenes que falten
        run: |
          mkdir -p disenos-ia/salida
          python3 - <<'PY'
          import csv, os, time, urllib.parse, urllib.request
          for r in csv.DictReader(open("disenos-ia/prompts.csv")):
              out = f"disenos-ia/salida/{r['id']}.jpg"
              if os.path.exists(out): continue
              q = urllib.parse.quote(r["prompt"])
              url = f"https://image.pollinations.ai/prompt/{q}?width=1024&height=1024&nologo=true&model=flux&seed=7"
              for intento in range(4):
                  try:
                      data = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "disenos-bot"}), timeout=180).read()
                      if len(data) > 20000:
                          open(out, "wb").write(data); print("OK", out, len(data)); break
                  except Exception as e:
                      print("error", r["id"], e)
                  time.sleep(20)
              time.sleep(16)
          PY
      - name: Guardar
        run: |
          git config user.name "disenos-bot"; git config user.email "actions@users.noreply.github.com"
          git add disenos-ia/salida
          git commit -m "Disenos IA generados" || exit 0
          git push
