# Publicación diaria de Handy Calcs, gratis y sin Claude (regla de Azu: 2 o 3 cosas por día, nunca todo junto).
# Todos los días a las 8 AM de Utah (15:00 UTC en invierno):
#   1. imprimibles/generar.py diario: juego del día (sudoku + sopa de letras) y cola de fichas bilingües
#   2. build.py: rearma la web; calendarios y guía de herramientas sueltan sus pins/páginas del día (tools/goteo.py)
#   3. commit si cambió algo publicable -> Cloudflare Pages publica solo (proyecto conectado a este repo)
name: Publicación diaria (imprimibles y goteo)
run-name: ${{ (inputs.turno || github.event.schedule) && format('Turno {0}', inputs.turno || github.event.schedule) || github.workflow }}
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      turno: { description: "Lo usa el despertador (dejar vacío a mano)", default: "" }
permissions:
  actions: read
  contents: write
concurrency:
  group: handycalcs-publicacion
  cancel-in-progress: false
jobs:
  turno:
    # Despertador: el mismo turno puede llegar dos veces (el despertador de Cloudflare a horario y el cron de GitHub
    # atrasado). Corre solo el primero; el segundo termina en verde sin hacer nada. Corridas a mano: siempre corren.
    runs-on: ubuntu-latest
    outputs:
      correr: ${{ steps.ver.outputs.correr }}
    steps:
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          TURNO: ${{ inputs.turno || github.event.schedule }}
        run: |
          if [ -z "$TURNO" ]; then echo "correr=si" >> "$GITHUB_OUTPUT"; exit 0; fi
          wf=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id) || { echo "No pude revisar turnos anteriores: corre igual."; echo "correr=si" >> "$GITHUB_OUTPUT"; exit 0; }
          desde=$(date -u -d '-14 hours' +%FT%TZ)
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?created=%3E%3D$desde&status=success&per_page=100" \
                --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .display_title == \"Turno $TURNO\")] | length") || n=0
          if [ "${n:-0}" -gt 0 ]; then
            echo "El turno '$TURNO' ya corrió en las últimas 14 horas: no se repite."
            echo "correr=no" >> "$GITHUB_OUTPUT"
          else
            echo "correr=si" >> "$GITHUB_OUTPUT"
          fi
  diario:
    needs: turno
    if: needs.turno.outputs.correr == 'si'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fuentes y librerías del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 fonts-inter fonts-dejavu-core fontconfig
          fc-cache -f
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r imprimibles/requirements.txt
      - name: Juego del día y fichas
        run: python3 imprimibles/generar.py diario
      - name: Rearmar la web (con goteo)
        run: python3 build.py
      - name: Commit si hay algo nuevo para publicar
        run: |
          if git diff --quiet -- site imprimibles calendarios herramientas pines ':(exclude)site/sitemap.xml' && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Hoy no sale nada nuevo"; exit 0
          fi
          git config user.name "publicacion-bot"
          git config user.email "publicacion-bot@users.noreply.github.com"
          git add -A
          git commit -m "Publicación diaria $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done; exit 1
