# Avisa a Bing y otros buscadores (IndexNow) de las páginas nuevas, todos los días después de la publicación diaria.
# Gratis, sin Claude. Si la web no está en línea todavía, no hace nada.
name: Avisar buscadores (IndexNow)
on:
  schedule:
    - cron: "40 15 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: indexnow-sent.txt
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-
      - run: python3 tools/indexnow.py indexnow-sent.txt
      - uses: actions/cache/save@v4
        if: always() && hashFiles('indexnow-sent.txt') != ''
        with:
          path: indexnow-sent.txt
          key: indexnow-${{ github.run_id }}
