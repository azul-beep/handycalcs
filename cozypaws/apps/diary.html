<!--HEAD-->
<meta name="theme-color" content="#3B2433">
<link rel="icon" href="/img/icon.png"><link rel="apple-touch-icon" href="/diary/icons/apple-touch-icon.png">

<!--SHARED_STYLE-->
<style>
.top{border-bottom-color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.kpi{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:10px;text-align:center}.kpi b{font-family:Abril,Georgia,serif;font-weight:400;font-size:24px;color:var(--plum);display:block;line-height:1.1}.kpi span{font-size:13px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quick button{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:10px 4px;cursor:pointer;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}.quick button i{font-style:normal;font-size:24px}
.quick button.done{background:#e8f0f0;border-color:var(--blue)}
.item{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px;margin:8px 0}
.item .ic{font-size:26px;line-height:1}.item .tx{flex:1;min-width:0}.item .tx b{color:var(--plum)}.item .tx small{color:var(--muted);display:block}
.item .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.ib{border:1.5px solid var(--line);background:var(--cream2);border-radius:10px;padding:5px 9px;cursor:pointer;font-size:14px}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--cream);margin:2px 4px 0 0}
.due{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--cream);color:var(--plum)}.due.late{background:var(--rose);color:#fff}.due.today{background:var(--gold);color:#fff}
.thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none;cursor:pointer}
.chart{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:8px}
.meter{position:relative;height:14px;border-radius:99px;background:linear-gradient(90deg,#e7c27a 0 25%,#9cc5a1 25% 75%,#e09a8f 75%);margin:14px 0 4px}.meter i{position:absolute;top:-5px;width:6px;height:24px;border-radius:3px;background:var(--plum);transform:translateX(-3px)}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:20px 10px}
.togs{display:flex;flex-wrap:wrap;gap:6px}.togs .chip{font-size:13px}
details.more{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:10px 14px;margin:10px 0}details.more summary{cursor:pointer;font-weight:600;color:var(--plum)}
</style>
<!--ANALYTICS-->
</head><body>
<header class="top"><a class="b" href="./"><img src="/img/logo-160.png" alt="" width="40" height="40"><span>Paw Diary<small>by Cozy Paws</small></span></a>
<button class="chip" id="inst" type="button"></button><a class="chip" id="lang" href="__OTHER_URL__">__OTHER_LABEL__</a></header>
<main class="wrap">
<section class="view" id="v-home"></section>
<section class="view" id="v-log"></section>
<section class="view" id="v-rem"></section>
<section class="view" id="v-health"></section>
<section class="view" id="v-more"></section>
</main>
<div class="foot"></div>

<button data-tab="rem"><i>⏰</i><span data-t="tRem"></span></button>

/* ------------------------------------------------------------ fechas y unidades */
function today(){var d=new Date();d.setHours(0,0,0,0);return d}
function pd(s){if(!s)return null;var a=s.split('-');return new Date(+a[0],a[1]-1,+a[2])}
function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function fmt(s){var d=pd(s);return d?d.toLocaleDateString(L==='es'?'es-US':'en-US',{weekday:'short',month:'short',day:'numeric'}):''}
function days(s){return Math.round((pd(s)-today())/864e5)}
function ageY(p){var b=pd(p.bday);return b?(today()-b)/(365.25*864e5):null}
function kg2u(k){return D.unit==='lb'?k*2.20462:k}function u2kg(v){return D.unit==='lb'?v/2.20462:v}
function wfmt(k){return k==null?'—':(Math.round(kg2u(k)*10)/10)+' '+D.unit}
function addRep(s,r){var d=pd(s);if(r==='w')d.setDate(d.getDate()+7);else if(r==='m')d.setMonth(d.getMonth()+1);else if(r==='m3')d.setMonth(d.getMonth()+3);else if(r==='m6')d.setMonth(d.getMonth()+6);else if(r==='y')d.setFullYear(d.getFullYear()+1);return iso(d)}

  h+='<div class="box"><b>'+t('ideal',{breed:esc(br[L==='es'?1:0]),a:Math.round(kg2u(a)),b:Math.round(kg2u(b)),u:D.unit})+'</b><div class="meter"><i style="left:'+pos+'%"></i></div><div class="legend"><span>'+t('under')+'</span><span>'+t('inRange')+'</span><span>'+t('over')+'</span></div><p style="margin-bottom:0"><b>'+wfmt(lw)+': '+t(st)+'</b></p><p class="muted">'+t('idealMixed')+'</p></div>'}
 else h+='<p class="muted">'+t('idealMixed')+'</p>';
 h+='<button class="btn ghost" id="hw">'+t('addWeight')+'</button>';
 h+='<h2>🍽️ '+t('foodH')+'</h2><p class="muted">'+t('foodL')+'</p><div class="box">'+(lw?'<div class="row"><label>'+t('goal')+'<select id="fg"><option value="keep">'+t('goals').keep+'</option><option value="lose">'+t('goals').lose+'</option></select></label>'+
  '<label>'+t('kcalCup')+'<div style="display:flex;gap:6px"><input type="number" id="fk" min="50" max="6000" value="'+(D.kcal||(p.species==='cat'?400:370))+'"><select id="fu" style="width:auto"><option value="cup">'+t('perCup')+'</option><option value="kg"'+(D.kcalU==='kg'?' selected':'')+'>'+t('perKg')+'</option></select></div></label></div><div class="result" id="fres"></div>':'<p>'+t('noWeight')+'</p>')+'<p class="muted">'+t('vetNote')+'</p></div>'+adSlot()+shop();
 $('#v-health').innerHTML=h;$('#hw').onclick=function(){var v=prompt(t('weight')+' ('+D.unit+')');var n=parseFloat(String(v||'').replace(',','.'));if(n>0){D.log.push({id:uid(),pet:p.id,d:iso(today()),tm:'',k:'weight',w:Math.round(u2kg(n)*100)/100});saveD();track('weight_added');renderHealth()}};
 if(!lw)return;
 function food(){var goal=$('#fg').value,kc=parseFloat($('#fk').value)||370,unit=$('#fu').value;D.kcal=kc;D.kcalU=unit;saveD();var y=ageY(p),kgw=lw;
  if(goal==='lose'&&br)kgw=Math.min(lw,(br[2]+br[3])/2);var rer=70*Math.pow(kgw,0.75),f;
  if(p.species==='cat'){f=goal==='lose'?0.8:y!=null&&y<1?2.5:p.neut?1.2:1.4;if(p.act==='high'&&goal!=='lose')f+=0.2}
  else{if(goal==='lose')f=1.0;else if(y!=null&&y<0.34)f=3;else if(y!=null&&y<1)f=2;else{f=p.neut?1.6:1.8;if(p.act==='low')f-=0.2;if(p.act==='high')f+=0.4;if(p.act==='work')f=3;if(y!=null&&y>=8&&p.act!=='high'&&p.act!=='work')f=Math.min(f,1.4)}}
  var k=Math.round(rer*f),water=D.unit==='lb'?Math.round(lw*2.20462)+' oz':Math.round(lw*60)+' ml';
  $('#fres').innerHTML='<div class="big" style="font-size:34px">'+t('perDay',{k:k})+'</div><b>'+(unit==='cup'?t('cups',{c:(k/kc).toFixed(1)}):t('grams',{g:Math.round(k/kc*1000)}))+'</b><br>💧 '+t('water',{w:water})+'<br>🦴 '+t('treats',{t:Math.round(k*.1)})+'<br><small class="muted">RER '+Math.round(rer)+' kcal × '+f.toFixed(1)+'</small>'}
 ['#fg','#fk','#fu'].forEach(function(s){$(s).addEventListener('input',food)});food()}
function chart(ws){var W=640,H=220,pad=36,xs=ws.map(function(x){return pd(x.d).getTime()}),ys=ws.map(function(x){return kg2u(x.w)}),x0=Math.min.apply(0,xs),x1=Math.max.apply(0,xs)||x0+1,y0=Math.min.apply(0,ys),y1=Math.max.apply(0,ys);
 if(x1===x0)x1=x0+864e5;var m=(y1-y0)*.15||1;y0-=m;y1+=m;var X=function(v){return pad+(v-x0)/(x1-x0)*(W-pad*2)},Y=function(v){return H-pad+-(v-y0)/(y1-y0)*(H-pad*2)};
 var pts=ws.map(function(x,i){return X(xs[i]).toFixed(1)+','+Y(ys[i]).toFixed(1)}).join(' ');
 return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="weight chart"><line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="#E2D3B8"/><text x="'+pad+'" y="'+(pad-12)+'" font-size="14" fill="#7b6b62">'+y1.toFixed(1)+' '+D.unit+'</text><text x="'+pad+'" y="'+(H-pad+22)+'" font-size="14" fill="#7b6b62">'+fmt(ws[0].d)+'</text><text x="'+(W-pad)+'" y="'+(H-pad+22)+'" font-size="14" fill="#7b6b62" text-anchor="end">'+fmt(ws[ws.length-1].d)+'</text>'+
 '<polyline points="'+pts+'" fill="none" stroke="#4E7F86" stroke-width="3" stroke-linejoin="round"/>'+ws.map(function(x,i){return '<circle cx="'+X(xs[i]).toFixed(1)+'" cy="'+Y(ys[i]).toFixed(1)+'" r="5" fill="#3B2433"><title>'+fmt(x.d)+': '+wfmt(x.w)+'</title></circle>'}).join('')+'</svg>'}
